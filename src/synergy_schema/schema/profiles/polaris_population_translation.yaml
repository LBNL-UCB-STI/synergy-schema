id: https://w3id.org/LBNL-UCB-STI/synergy-schema/profiles/polaris-population-translation
name: polaris_population_translation
title: POLARIS population translation profile
description: >-
  Workflow-owned receipt for translated annual POLARIS population artifacts.
  It composes partial POLARIS-native projections with source trajectory,
  mapping, implementation, and artifact evidence without redefining native
  POLARIS records.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types
  - ../core/handoff_bundle
  - ../core/population_trajectory
  - ../mappings/population_translation
  - ../models/polaris/polaris_population
  - pilates_population

enums:
  PolarisPopulationArtifactRole:
    description: Required translated POLARIS population artifact role for one year.
    permissible_values:
      households: {}
      persons: {}
      vehicles: {}
      vehicle_class: {}
      vehicle_type: {}
  PopulationReceiptGenerationMode:
    description: Method that produced a translated population receipt.
    permissible_values:
      manual_discovery:
        description: Discovery evidence that cannot satisfy production acceptance.
      automatic_adapter:
        description: Receipt generated by the registered workflow adapter.

classes:
  PolarisPopulationTranslationBundleMember:
    description: >-
      One byte-identified translated POLARIS population artifact for a single
      simulation year and semantic role.
    is_a: HandoffBundleMember
    slot_usage:
      semantic_role:
        range: PolarisPopulationArtifactRole
        required: true
    attributes:
      simulation_year:
        range: integer
        required: true
        description: Simulation year represented by this translated artifact.
  PolarisPopulationTranslationBundle:
    description: >-
      Derived POLARIS population exchange package for a scenario realization.
      It preserves the source trajectory identity and mapping/implementation
      evidence while leaving native POLARIS records as partial projections.
    is_a: HandoffBundle
    annotations:
      conformance_requirements: >-
        Conditional cross-document checks require exactly one member for every
        PolarisPopulationArtifactRole in every successful year; requested,
        successful, and skipped years must agree with the source trajectory;
        complete cannot be declared when a requested year was skipped; source
        and target schema contracts, mapping and implementation digest pairs,
        and residue observations must agree with their referenced releases.
        Production acceptance additionally requires automatic_adapter,
        approved mapping, and conformance_checked implementation. These checks
        are enforced by later conformance code rather than standard LinkML
        validation.
    attributes:
      source_trajectory_bundle:
        range: PopulationTrajectoryBundleReference
        required: true
        inlined: true
        description: Typed stable-ID and immutable-digest reference to the source trajectory bundle.
      scenario_definition_ref:
        range: ScenarioDefinitionReference
        required: true
        inlined: true
        description: Immutable scenario definition shared with the source trajectory.
      stochastic_realization_id:
        required: true
        description: Stochastic realization shared with the source trajectory.
      population_translation_contract:
        range: PopulationTranslationContractReference
        required: true
        inlined: true
        description: Exact immutable population translation contract release applied.
      translation_implementation_binding:
        range: TranslationImplementationBindingReference
        required: true
        inlined: true
        description: Exact registered workflow implementation binding observed.
      implementation_artifact:
        range: PhysicalArtifactReference
        required: true
        inlined: true
        description: Byte-identified executable, script, or SQL artifact used for translation.
      source_schema_contract:
        range: SchemaContractReference
        required: true
        inlined: true
        description: Source table shape contract used by the translator.
      target_schema_contract:
        range: SchemaContractReference
        required: true
        inlined: true
        description: Target table shape contract used by the translator.
      members:
        range: PolarisPopulationTranslationBundleMember
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 5
        description: Five translated artifact roles for each successful simulation year.
      residue_observations:
        range: MappingResidueObservation
        multivalued: true
        inlined_as_list: true
        description: Run-specific observations of declared translation residues.
      receipt_generation_mode:
        range: PopulationReceiptGenerationMode
        required: true
        description: Whether this receipt was discovered manually or emitted by an adapter.
      requested_years:
        range: integer
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: Requested handoff years copied from the source trajectory.
      successful_years:
        range: integer
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: Successfully translated handoff years copied from the source trajectory.
      skipped_years:
        range: SkippedPopulationYear
        multivalued: true
        inlined_as_list: true
        description: Requested years skipped by the source trajectory.
