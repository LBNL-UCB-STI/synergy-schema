id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/demos/polaris-mapped-examples
name: demos_polaris_mapped_examples
title: DEMOS Synthetic Population and Demographic Evolution Exports
description: >-
  LinkML schema defining the household and person synthetic population exports
  produced by the DEMOS demographic evolution model and formatted for downstream
  travel demand and vehicle fleet modeling.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

subsets:
  demos:
    title: "DEMOS Demographic Evolution"
    description: >-
      Synthetic household and person records evolved across simulation years by
      DEMOS with Census ACS PUMS seed lineage.

classes:
  DemosPolarisMappedHousehold:
    in_subset:
      - demos
    description: >-
      Authoritative household schema for DEMOS synthetic population mapped
      for POLARIS simulation. Physical columns match the DEMOS household export.
    aliases:
      - DemosHousehold
    annotations:
      model_association: DEMOS
      artifact_table: "Household2018_POLARIS_mapped.csv"
      schema_status: authoritative
      status: active
    attributes:
      household:
        range: integer
        identifier: true
        required: true
        description: Unique household identifier.
      block_id:
        range: integer
        required: true
        annotations:
          foreign_key: UrbanSimBlockMarginals.block_id
        description: Residential Census Block Group or Block FIPS identifier.
      lcm_county_id:
        range: integer
        required: true
        description: Five-digit state and county FIPS identifier (e.g. 48453 for Travis County).
      age_of_head:
        range: float
        required: true
        description: Age of the household head in years.
      workers:
        range: float
        required: true
        description: Number of employed workers in the household.
      race_of_head:
        range: float
        required: true
        description: Race category code of the household head (ACS PUMS RAC1P coding).
      income:
        range: float
        required: true
        description: Annual household income in dollars.
      persons:
        range: integer
        required: true
        description: Total number of persons residing in the household.
      is_reorg_household:
        range: boolean
        required: true
        description: Flag indicating whether the household was newly formed or reorganized during demographic evolution.
      serialno_pums:
        range: string
        required: false
        annotations:
          physical_name: SERIALNO_PUMS
          observed_value_gap: >-
            Optional for newly formed or reorganized synthetic households without a direct PUMS seed record.
        description: Source Census ACS PUMS household serial number for seed lineage tracking.

  DemosPolarisMappedPerson:
    in_subset:
      - demos
    description: >-
      Authoritative person schema for DEMOS synthetic population mapped for
      POLARIS simulation. Physical columns match the DEMOS person export.
    aliases:
      - DemosPerson
    annotations:
      model_association: DEMOS
      artifact_table: "Person2018_POLARIS_mapped.csv"
      schema_status: authoritative
      status: active
    attributes:
      person:
        range: integer
        required: true
        description: Within-household person index or person identifier.
      relp:
        range: integer
        required: true
        annotations:
          crosswalk: X-P1
        description: Relationship to household head code (ACS PUMS RELP coding).
      gender:
        range: integer
        required: true
        annotations:
          crosswalk: X-P1
        description: Sex/gender code (1=Male, 2=Female).
      education:
        range: integer
        required: true
        annotations:
          crosswalk: X-P1, X-P6
        description: Educational attainment category code.
      income:
        range: float
        required: true
        description: Annual individual personal income in dollars.
      id:
        range: float
        annotations:
          observed_value_gap: >-
            Optional internal DEMOS row index; not required on all evolved person records.
        description: Optional internal person index exported by DEMOS.
      age:
        range: integer
        required: true
        description: Person age in years.
      household:
        range: integer
        required: true
        annotations:
          foreign_key: DemosPolarisMappedHousehold.household
        description: Household identifier linking the person to DemosPolarisMappedHousehold.
      marital_status:
        range: integer
        required: true
        annotations:
          crosswalk: X-P1
          donor_draw: D-P3a
        description: Marital status code (ACS PUMS MAR coding).
      employment:
        range: float
        required: true
        annotations:
          crosswalk: X-P1, X-P2
        description: Employment status category code (ACS PUMS ESR coding).
      school_enrollment:
        range: float
        required: true
        annotations:
          crosswalk: X-P1
        description: School enrollment and grade level code (ACS PUMS SCHG coding).
      serialno_pums:
        range: string
        required: false
        annotations:
          physical_name: SERIALNO_PUMS
          observed_value_gap: >-
            Optional for simulated newborn agents or unlinked synthetic records.
        description: Source Census ACS PUMS household serial number for seed lineage tracking.
      sporder:
        range: float
        required: false
        annotations:
          physical_name: SPORDER
          observed_value_gap: >-
            Optional for simulated newborn agents or unlinked synthetic records.
        description: Source Census ACS PUMS person sequence number within the seed household.
