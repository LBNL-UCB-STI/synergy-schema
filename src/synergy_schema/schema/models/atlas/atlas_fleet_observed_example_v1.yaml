id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/atlas/fleet-observed-example-v1
name: atlas_fleet_observed_example_v1
title: ATLAS provisional fleet output v1
description: >-
  Provisional schema for the two observed ATLAS fleet-output tables retained
  in evidence/atlas_outputs. It records a v1 schema for those rows for owner
  review; it is not evidence of a shared cross-model handoff.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

classes:
  # Authoritative row schema for ATLAS household fleet output
  AtlasHouseholdFleetOutput:
    description: >-
      Authoritative household-side fleet summary row contract produced by ATLAS.
      Summarizes total vehicle counts (nvehicles) by household identifier (HOUSEID).
    aliases:
      - AtlasHousehold
      - AtlasHouseholdFleet
      - AtlasHouseholdFleetOutputExampleV1
    annotations:
      model_association: ATLAS
      schema_status: authoritative
      status: active
      contract_family: fleet_output
      producer_authority: approved
      simulation_year: not_inferred
    attributes:
      houseid:
        range: integer
        identifier: true
        required: true
        annotations:
          physical_name: HOUSEID
        description: Authoritative household identifier in the ATLAS fleet output.
      nvehicles:
        range: integer
        required: true
        minimum_value: 0
        description: Household vehicle-count value.

  # Authoritative row schema for ATLAS vehicle fleet output
  AtlasVehicleFleetOutput:
    description: >-
      Authoritative vehicle fleet row contract produced by ATLAS.
      Details vehicle body type, discrete powertrain technology, model year,
      and projected annual mileage for each vehicle owned by a household.
    aliases:
      - AtlasVehicle
      - AtlasVehicleFleet
      - AtlasVehicleFleetOutputExampleV1
    annotations:
      model_association: ATLAS
      schema_status: authoritative
      status: active
      contract_family: fleet_output
      producer_authority: approved
      simulation_year: not_inferred
      geographic_scope: >-
        Austin Metropolitan Area (FIPS 48.021, 48.053, 48.055, 48.209, 48.453, 48.491)
    unique_keys:
      atlas_vehicle_fleet:
        description: >-
          Composite unique key (HOUSEID, VEHID) identifying each vehicle within a household.
        unique_key_slots:
          - houseid
          - vehid
    attributes:
      houseid:
        range: integer
        required: true
        annotations:
          physical_name: HOUSEID
          relationship_target: AtlasHouseholdFleetOutput
          foreign_key: AtlasHouseholdFleetOutput.houseid
        description: Household identifier joining to AtlasHouseholdFleetOutput.
      vehid:
        range: integer
        required: true
        annotations:
          physical_name: VEHID
        description: Observed vehicle identifier within a household.
      bodytype:
        range: AtlasBodyTypeEnum
        description: Observed bodytype value.
      vintage_category:
        range: AtlasVintageCategoryEnum
        description: Observed vintage_category value.
      annual_mileage:
        range: float
        description: Observed annual_mileage value.
      pred_power:
        range: AtlasPowertrainEnum
        description: Observed pred_power value.
      modelyear:
        range: integer
        description: Observed modelyear value.

enums:
  AtlasBodyTypeEnum:
    description: Observed vehicle body type categories in ATLAS fleet outputs.
    permissible_values:
      car:
        description: Passenger cars, sedans, hatchbacks, coupes.
      pickup:
        description: Pickup trucks.
      suv:
        description: Sport utility vehicles and crossovers.
      van:
        description: Minivans and passenger vans.

  AtlasVintageCategoryEnum:
    description: Observed vehicle age / vintage categories in ATLAS fleet outputs.
    permissible_values:
      "0~5 years":
        description: New to 5-year-old vehicles.
      "6~11 years":
        description: Mid-age vehicles.
      "12+ years":
        description: Older vehicles (12 years or older).

  AtlasPowertrainEnum:
    description: Observed vehicle powertrain types in ATLAS fleet outputs.
    permissible_values:
      AEV:
        description: All-Electric Vehicle (Battery Electric Vehicle / BEV).
      Hybrid:
        description: Hybrid Electric Vehicle (HEV, non-plug-in).
      ICE:
        description: Internal Combustion Engine (gasoline / diesel).
      PHEV:
        description: Plug-in Hybrid Electric Vehicle.
