      HOV2TOLL_VTOLL:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/HOV2TOLL_VTOLL__{EA,AM,MD,PM,EV}"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
