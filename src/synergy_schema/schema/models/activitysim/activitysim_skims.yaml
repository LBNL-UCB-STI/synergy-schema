          calculations (OMX: /data/WLK_TRN_WLK_WACC__{AM,MD,PM}).
      WLK_TRN_WLK_WAUX:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/WLK_TRN_WLK_WAUX__{AM,MD,PM}"
