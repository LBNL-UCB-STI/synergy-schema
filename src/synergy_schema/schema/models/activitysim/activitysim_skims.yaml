        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk transfer wait time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_XWAIT__{AM,MD,PM}).
      WLK_TRN_WLK_WACC:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
