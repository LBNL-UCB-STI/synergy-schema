      HOV2_BTOLL:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/HOV2_BTOLL__{EA,AM,MD,PM,EV}"
          status: provisional
        description: >-
