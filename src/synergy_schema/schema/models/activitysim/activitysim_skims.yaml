      HOV2TOLL_TIME:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/HOV2TOLL_TIME__{EA,AM,MD,PM,EV}"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          HOV2 toll-lane travel time in minutes (OMX: /data/HOV2TOLL_TIME__{EA,AM,MD,PM,EV}).
      HOV2TOLL_DIST:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/HOV2TOLL_DIST__{EA,AM,MD,PM,EV}"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
