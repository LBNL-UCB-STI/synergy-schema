        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          HOV2 (shared ride 2) travel time in minutes (OMX: /data/HOV2_TIME__{EA,AM,MD,PM,EV}).
      HOV2_DIST:
