id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/activitysim/skims
name: activitysim_skims
title: ActivitySim network travel skims schema (Open Matrix .omx and Zarr)
description: >-
  Canonical production Open Matrix (.omx) and Zarr (.zarr) transportation network
  skim container consumed by ActivitySim (and downstream accessibility consumers
  such as UrbanSim and ATLAS) in integrated PILATES and Synergy workflows.
  Modeled on the production MTC/ActivitySim skims.omx HDF5 layout
  (root attributes OMX_VERSION='0.2' and SHAPE=[N_zones, N_zones], /data group
  containing 2D float64 OD matrices, and /lookup group containing 1D zone index
  lookup tables). Time-dependent matrices in OMX (/data/<MODE>_<MEASURE>__<PERIOD>)
  correspond to 3D [time_period, origin_zone, destination_zone] arrays when stacked
  along time_period (or stored in Zarr).

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

subsets:
  network_skims:
    title: Network Travel Skims (.omx / .zarr)
    description: Zone-to-zone travel time, distance, and cost impedance matrices exchanged across models.

types:
  NonNegativeFloat:
    typeof: float
    minimum_value: 0.0
    description: Non-negative floating-point travel impedance measure (time, distance, boardings, or monetary cost).

classes:
  ActivitySimNetworkSkims:
    in_subset:
      - network_skims
    rank: 3
    description: >-
      Canonical multi-modal, multi-period zone-to-zone impedance matrix container
      consumed by ActivitySim in Open Matrix (.omx) or Zarr (.zarr) array format.
      In HDF5 .omx storage, root attributes define `OMX_VERSION = '0.2'` and
      `SHAPE = [N_zones, N_zones]`, group `/lookup` holds 1D `[origin_zone]` zone index
      lookup vectors, and group `/data` holds 2D float64 `(origin_zone, destination_zone)`
      matrices where time-dependent modes are stored per period as
      `/data/<MODE>_<MEASURE>__<PERIOD>` (periods EA, AM, MD, PM, EV for auto and
      transit submodes; AM, MD, PM for `WLK_TRN_WLK` accessibility skims), corresponding
      to 3D `[time_period, origin_zone, destination_zone]` arrays in stacked or Zarr
      representation. Provisional note: the classification of `DIST`, `DISTWALK`, `SOV_*`,
      and `WLK_TRN_WLK_*` as `required: true` and all other mode families (`DISTBIKE`,
      `SOVTOLL_*`, `HOV2*`, `HOV3*`, and transit submodes) as `required: false` is provisional
      and worth verifying against target regional model configurations.
    aliases:
      - ActivitySimSkims
      - ActivitySimOmxSkims
    annotations:
      owner: ActivitySim
      model_association: ActivitySim
      artifact_table: "skims.omx / skims.zarr (ActivitySim)"
      contract_family: network_skims
      format: "omx, zarr"
      default_skim_representation: true
      schema_status: authoritative
      status: provisional
      required_optional_mode_split_status: provisional
      producer_model: BEAM
      consumer_models: "ActivitySim, UrbanSim, ATLAS"
    attributes:
      file_path:
        range: string
        identifier: true
        required: true
        description: Relative path to the skims.omx or skims.zarr matrix archive.
      format:
        range: string
        ifabsent: string(omx)
        description: Storage format indicator for the multi-dimensional skim array container ('omx' or 'zarr'; defaults to 'omx').
      omx_version:
        range: string
        ifabsent: string(0.2)
        annotations:
          hdf5_root_attribute: OMX_VERSION
        description: Open Matrix HDF5 root attribute OMX_VERSION (canonical value '0.2').
      zone_count:
        range: integer
        required: true
        minimum_value: 1
        annotations:
          hdf5_root_attribute: SHAPE
        description: >-
          Number of Traffic Analysis Zones (TAZ) in square matrix dimension,
          corresponding to HDF5 root attribute SHAPE = [N_zones, N_zones].
      time_periods:
        range: string
        ifabsent: string(EA,AM,MD,PM,EV)
        description: >-
          Ordered time-of-day periods represented along the time_period axis
          ('EA,AM,MD,PM,EV' for 5-period auto and submode transit skims; 'AM,MD,PM'
          for 3-period WLK_TRN_WLK accessibility skims).
      zone_lookup:
        range: integer
        required: false
        array:
          dimensions:
            - alias: origin_zone
        annotations:
          omx_path: /lookup/zone_id
          hdf5_group: /lookup
        description: >-
          1D zone index lookup array [origin_zone] stored under OMX HDF5 group
          /lookup/<name> mapping 0-based matrix row/column indices to canonical TAZ IDs.

      # ========================================================================
      # Required Core Skim Arrays (required: true, status: provisional)
      # ========================================================================
      DIST:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path: /data/DIST
          hdf5_group: /data
          status: provisional
        description: >-
          2D static OD matrix [origin_zone, destination_zone] of all-day highway/drive
          network distance in miles (OMX: /data/DIST).
      DISTWALK:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path: /data/DISTWALK
          hdf5_group: /data
          status: provisional
        description: >-
          2D static OD matrix [origin_zone, destination_zone] of all-day walk network
          distance in miles (OMX: /data/DISTWALK).
      SOV_TIME:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_TIME__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) in-vehicle travel time in minutes across
          periods EA, AM, MD, PM, EV (OMX: /data/SOV_TIME__{EA,AM,MD,PM,EV}).
      SOV_DIST:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_DIST__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) travel distance in miles across periods
          EA, AM, MD, PM, EV (OMX: /data/SOV_DIST__{EA,AM,MD,PM,EV}).
      SOV_BTOLL:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_BTOLL__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) bridge toll cost across periods
          EA, AM, MD, PM, EV (OMX: /data/SOV_BTOLL__{EA,AM,MD,PM,EV}).
      WLK_TRN_WLK_IVT:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/WLK_TRN_WLK_IVT__{AM,MD,PM}"
          time_periods: "AM,MD,PM"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk in-vehicle time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_IVT__{AM,MD,PM}).
      WLK_TRN_WLK_IWAIT:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/WLK_TRN_WLK_IWAIT__{AM,MD,PM}"
          time_periods: "AM,MD,PM"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk initial wait time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_IWAIT__{AM,MD,PM}).
      WLK_TRN_WLK_XWAIT:
        range: NonNegativeFloat
