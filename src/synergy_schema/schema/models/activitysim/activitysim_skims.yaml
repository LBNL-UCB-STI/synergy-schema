          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk auxiliary walk time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_WAUX__{AM,MD,PM}).
      WLK_TRN_WLK_WEGR:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/WLK_TRN_WLK_WEGR__{AM,MD,PM}"
          time_periods: "AM,MD,PM"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk walk egress time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_WEGR__{AM,MD,PM}).

      # ========================================================================
      # Optional Mode Families (required: false, status: provisional)
      # ========================================================================
      DISTBIKE:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path: /data/DISTBIKE
          hdf5_group: /data
          status: provisional
        description: >-
          2D static OD matrix [origin_zone, destination_zone] of all-day bicycle
          network distance in miles (OMX: /data/DISTBIKE).
      SOVTOLL_TIME:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOVTOLL_TIME__{EA,AM,MD,PM,EV}"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          SOV toll-lane travel time in minutes (OMX: /data/SOVTOLL_TIME__{EA,AM,MD,PM,EV}).
      SOVTOLL_DIST:
        range: NonNegativeFloat
        required: false
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOVTOLL_DIST__{EA,AM,MD,PM,EV}"
