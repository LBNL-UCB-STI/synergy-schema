id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/activitysim/population
name: activitysim_population
title: ActivitySim Population and Land-Use Input Schema
description: >-
  LinkML schema defining the household, person, and land-use zone input records
  consumed by the ActivitySim activity-based travel demand model in PILATES and
  Synergy workflows.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

subsets:
  activitysim:
    title: "ActivitySim Travel Demand"
    description: >-
      Household, person, and Traffic Analysis Zone (TAZ) land-use input tables
      consumed by ActivitySim for tour and mode choice modeling.

classes:
  ActivitySimHouseholdInputRecord:
    in_subset:
      - activitysim
    description: >-
      Household input record consumed by ActivitySim, linking household identity,
      residential census block and traffic analysis zone (TAZ), and household
      vehicle ownership counts.
    annotations:
      owner: ActivitySim
      model_association: ActivitySim
      artifact_table: "households.csv"
      schema_status: authoritative
      status: active
    attributes:
      household_id:
        range: integer
        identifier: true
        required: true
        description: Unique household identifier.
      block_id:
        range: string
        description: >-
          15-digit Census Block FIPS identifier for the household location, preserving leading zeros.
      taz:
        range: ActivitySimLandUseZoneRecord
        inlined: false
        annotations:
          physical_name: TAZ
          relationship_target: ActivitySimLandUseZoneRecord
        description: Residential Traffic Analysis Zone (TAZ) reference.
      cars:
        range: integer
        minimum_value: 0
        description: >-
          Number of vehicles available to the household, updated from ATLAS
          (AtlasHouseholdFleetOutput.nvehicles) for auto-sufficiency and mode choice.
        annotations:
          source_table: AtlasHouseholdFleetOutput
          source_column: nvehicles
      auto_ownership:
        range: integer
        minimum_value: 0
        description: >-
          Household auto ownership level or vehicle count used by ActivitySim choice models.

  ActivitySimPersonInputRecord:
    in_subset:
      - activitysim
    description: >-
      Person input record consumed by ActivitySim, linking each synthetic person
      to their household and home, workplace, and school zones.
    annotations:
      owner: ActivitySim
      model_association: ActivitySim
      artifact_table: "persons.csv"
      schema_status: authoritative
      status: active
    attributes:
      person_id:
        range: integer
        identifier: true
        required: true
        description: Unique person identifier.
      household_id:
        range: ActivitySimHouseholdInputRecord
        inlined: false
        required: true
        annotations:
          relationship_target: ActivitySimHouseholdInputRecord
        description: Household identifier referencing ActivitySimHouseholdInputRecord.
      member_id:
        range: integer
        required: true
        description: Within-household person sequence number (1..hhsize).
      taz:
        range: ActivitySimLandUseZoneRecord
        inlined: false
        annotations:
          physical_name: TAZ
          relationship_target: ActivitySimLandUseZoneRecord
        description: Residential Traffic Analysis Zone (TAZ) reference.
      work_zone_id:
        range: integer
        description: Workplace zone identifier.
      workplace_taz:
        range: integer
        description: Workplace Traffic Analysis Zone (TAZ) identifier.
      school_zone_id:
        range: integer
        description: School zone identifier.
      school_taz:
        range: integer
        description: School Traffic Analysis Zone (TAZ) identifier.

  ActivitySimLandUseZoneRecord:
    in_subset:
      - activitysim
    description: >-
      Traffic Analysis Zone (TAZ) land-use input record consumed by ActivitySim.
    annotations:
      owner: ActivitySim
      model_association: ActivitySim
      artifact_table: "land_use.csv"
      schema_status: authoritative
      status: active
    attributes:
      taz:
        range: integer
        identifier: true
        required: true
        annotations:
          physical_name: TAZ
        description: Traffic Analysis Zone (TAZ) identifier.
