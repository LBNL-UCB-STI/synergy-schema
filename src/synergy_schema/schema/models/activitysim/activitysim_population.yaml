id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/activitysim/population
name: activitysim_population
title: ActivitySim population identity projections
description: >-
  ActivitySim-owned identity-bearing partial projections used to join household,
  person, and land-use-zone records across the current PILATES workflow.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

classes:
  ActivitySimHouseholdInputRecord:
    description: ActivitySim household input identity and location projection.
    annotations:
      owner: ActivitySim
      coverage: identity-bearing partial projection
      enforcement_status: PILATES-observed
    attributes:
      household_id:
        range: integer
        identifier: true
        required: true
        description: ActivitySim household identifier.
      block_id:
        range: string
        description: >-
          Census block identifier for the household location, preserving leading zeros.
      taz:
        range: ActivitySimLandUseZoneRecord
        inlined: false
        annotations:
          physical_name: TAZ
          relationship_target: ActivitySimLandUseZoneRecord
        description: Optional household traffic-analysis-zone reference.

  ActivitySimPersonInputRecord:
    description: ActivitySim person input identity and household-join projection.
    annotations:
      owner: ActivitySim
      coverage: identity-bearing partial projection
      enforcement_status: PILATES-observed
    attributes:
      person_id:
        range: integer
        identifier: true
        required: true
        description: ActivitySim person identifier.
      household_id:
        range: ActivitySimHouseholdInputRecord
        inlined: false
        required: true
        annotations:
          relationship_target: ActivitySimHouseholdInputRecord
        description: Household identifier referencing ActivitySimHouseholdInputRecord.
      member_id:
        range: integer
        required: true
        annotations:
          value_stability: regenerated by PILATES ActivitySim preprocessing
        description: Person ordinal regenerated by PILATES ActivitySim preprocessing.
      taz:
        range: ActivitySimLandUseZoneRecord
        inlined: false
        annotations:
          physical_name: TAZ
          relationship_target: ActivitySimLandUseZoneRecord
        description: Optional person traffic-analysis-zone reference.
      work_zone_id:
        range: integer
        annotations:
          mapping_scope: current PILATES ActivitySim adapter
        description: Optional workplace zone alias.
      workplace_taz:
        range: integer
        annotations:
          mapping_scope: current PILATES ActivitySim adapter
        description: Optional workplace traffic-analysis-zone alias.
      school_zone_id:
        range: integer
        annotations:
          mapping_scope: current PILATES ActivitySim adapter
        description: Optional school zone alias.
      school_taz:
        range: integer
        annotations:
          mapping_scope: current PILATES ActivitySim adapter
        description: Optional school traffic-analysis-zone alias.

  ActivitySimLandUseZoneRecord:
    description: ActivitySim land-use-zone identity projection.
    annotations:
      owner: ActivitySim
      coverage: identity-bearing partial projection
      enforcement_status: PILATES-observed
    attributes:
      taz:
        range: integer
        identifier: true
        required: true
        annotations:
          physical_name: TAZ
        description: ActivitySim traffic-analysis-zone identifier.
