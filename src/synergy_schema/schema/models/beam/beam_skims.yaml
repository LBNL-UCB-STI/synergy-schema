id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/beam/skims
name: beam_skims
title: BEAM network travel skims schema (Open Matrix .omx and Zarr)
description: >-
  Schema defining transportation network travel skim matrices and intermediate
  tabular OD skims produced by BEAM dynamic traffic simulation. BeamNetworkSkims
  (.omx / .zarr) is the default and authoritative BEAM skim representation,
  quantifying zone-to-zone (TAZ x TAZ) travel impedance across multiple time
  periods (Early AM, AM peak, Midday, PM peak, Evening) and modes (auto SOV/HOV,
  transit, active, and ridehail/TNC) using LinkML 1D, 2D, and 3D array dimensions.
  Modeled on the production MTC/ActivitySim/BEAM skims.omx HDF5 layout
  (root attributes OMX_VERSION='0.2' and SHAPE=[N_zones, N_zones], /data 2D float64
  OD matrices, and /lookup 1D zone index lookup tables).

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

subsets:
  network_skims:
    title: Network Travel Skims (.omx / .zarr)
    description: Zone-to-zone travel time, distance, and cost impedance matrices exchanged across models.

types:
  NonNegativeFloat:
    typeof: float
    minimum_value: 0.0
    description: Non-negative floating-point travel impedance measure (time, distance, volume, or monetary cost).
  UnitIntervalFloat:
    typeof: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Floating-point probability constrained to the closed unit interval [0.0, 1.0].

classes:
  BeamNetworkSkims:
    in_subset:
      - network_skims
    description: >-
      Default and authoritative multi-modal, multi-period zone-to-zone impedance
      matrix container emitted by BEAM simulation, packaged in Open Matrix (.omx)
      or Zarr (.zarr) array format. In HDF5 .omx storage, root attributes define
      `OMX_VERSION = '0.2'` and `SHAPE = [N_zones, N_zones]`, group `/lookup` holds 1D
      `[origin_zone]` zone index lookup tables, and group `/data` holds 2D float64
      `[origin_zone, destination_zone]` matrices where time-dependent modes are
      stored per period as `/data/<MODE>_<MEASURE>__<PERIOD>` (corresponding to 3D
      `[time_period, origin_zone, destination_zone]` arrays when stacked along
      `time_period` or in Zarr). Provisional note: the required vs. optional mode
      rules (marking `DIST`, `DISTWALK`, `SOV_*`, and `WLK_TRN_WLK_*` as `required: true`
      and all other modes like `DISTBIKE`, `SOVTOLL_*`, `HOV2*`, `HOV3*`, submode transit
      `WLK_{LOC,LRF,EXP,HVY,COM}_*` / `DRV_*`, and ridehail as `required: false`) are
      provisional and worth verifying against target regional model configurations.
    aliases:
      - BeamSkims
      - BeamSkimsOutput
    annotations:
      owner: BEAM
      model_association: BEAM
      artifact_table: "skims.omx / skims.zarr (BEAM)"
      contract_family: network_skims
      format: "omx, zarr"
      default_skim_representation: true
      schema_status: authoritative
      status: provisional
      required_optional_mode_split_status: provisional
      producer_model: BEAM
      consumer_models: "UrbanSim, ATLAS, ActivitySim, POLARIS"
    attributes:
      file_path:
        range: string
        identifier: true
        required: true
        description: Relative path to the .omx or .zarr matrix storage archive.
      format:
        range: string
        ifabsent: string(omx)
        description: Storage format indicator for the multi-dimensional skim array container ('omx' or 'zarr'; defaults to 'omx').
      omx_version:
        range: string
        ifabsent: string(0.2)
        annotations:
          hdf5_root_attribute: OMX_VERSION
        description: Open Matrix HDF5 root attribute OMX_VERSION (canonical value '0.2').
      zone_count:
        range: integer
        required: true
        minimum_value: 1
        annotations:
          hdf5_root_attribute: SHAPE
        description: >-
          Number of Traffic Analysis Zones (TAZ) in square matrix dimension
          (HDF5 root attribute SHAPE = [N_zones, N_zones]).
      time_periods:
        range: string
        ifabsent: string(EA,AM,MD,PM,EV)
        description: Modeled time-of-day periods represented in matrix slices (e.g. 'EA,AM,MD,PM,EV' or 'AM,MD,PM').
      zone_lookup:
        range: integer
        required: false
        array:
          dimensions:
            - alias: origin_zone
        annotations:
          omx_path: /lookup/zone_id
          hdf5_group: /lookup
        description: >-
          1D zone index lookup array [origin_zone] stored under OMX HDF5 group
          /lookup/<name> mapping 0-based matrix row/column indices to canonical TAZ IDs.
      iteration_number:
        range: integer
        minimum_value: 0
        description: BEAM simulation iteration count at which skims were extracted.
      converged:
        range: boolean
        description: Indicates whether dynamic traffic assignment achieved equilibrium convergence.

      # ========================================================================
      # Canonical Required Core Skim Arrays (required: true, status: provisional)
      # ========================================================================
      DIST:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path: /data/DIST
          hdf5_group: /data
          status: provisional
        description: >-
          2D static OD matrix [origin_zone, destination_zone] of all-day highway/drive
          network distance in miles (OMX: /data/DIST).
      DISTWALK:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path: /data/DISTWALK
          hdf5_group: /data
          status: provisional
        description: >-
          2D static OD matrix [origin_zone, destination_zone] of all-day walk network
          distance in miles (OMX: /data/DISTWALK).
      SOV_TIME:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_TIME__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) in-vehicle travel time in minutes across
          periods EA, AM, MD, PM, EV (OMX: /data/SOV_TIME__{EA,AM,MD,PM,EV}).
      SOV_DIST:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_DIST__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) travel distance in miles across periods
          EA, AM, MD, PM, EV (OMX: /data/SOV_DIST__{EA,AM,MD,PM,EV}).
      SOV_BTOLL:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/SOV_BTOLL__{EA,AM,MD,PM,EV}"
          time_periods: "EA,AM,MD,PM,EV"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          single-occupant vehicle (SOV) bridge toll cost across periods
          EA, AM, MD, PM, EV (OMX: /data/SOV_BTOLL__{EA,AM,MD,PM,EV}).
      WLK_TRN_WLK_IVT:
        range: NonNegativeFloat
        required: true
        array:
          dimensions:
            - alias: time_period
            - alias: origin_zone
            - alias: destination_zone
        annotations:
          omx_path_pattern: "/data/WLK_TRN_WLK_IVT__{AM,MD,PM}"
          time_periods: "AM,MD,PM"
          status: provisional
        description: >-
          3D time-dependent OD array [time_period, origin_zone, destination_zone] of
          generic walk-transit-walk in-vehicle time in minutes used for accessibility
          calculations (OMX: /data/WLK_TRN_WLK_IVT__{AM,MD,PM}).
      WLK_TRN_WLK_IWAIT:
        range: NonNegativeFloat
