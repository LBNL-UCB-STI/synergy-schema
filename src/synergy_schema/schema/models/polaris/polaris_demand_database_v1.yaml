id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/polaris/demand-database-v1
name: polaris_demand_database_v1
title: POLARIS Demand SQLite Database Schema
description: >-
  LinkML schema defining the Household, Person, Vehicle, Vehicle_Class, and
  Vehicle_Type tables in the POLARIS Demand SQLite database, along with
  provisional post-run state output tables.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

annotations:
  version: v1
  model_association: POLARIS
  status: provisional
  coverage: observed example full-fidelity population-table description
  conformance_boundary: >-
    Person.household and Vehicle.hhold joins to Household.household, as well as
    Vehicle.type to Vehicle_Type.type_id and Vehicle_Type.vehicle_class to
    Vehicle_Class.class_id, are external conformance checks; this table
    description does not declare SQLite foreign keys.

subsets:
  polaris:
    title: "POLARIS Demand & Post-Run State"
    description: >-
      SQLite input tables (Household, Person, Vehicle, Vehicle_Type, Vehicle_Class)
      in Demand.sqlite and post-run state feedback tables in Result.sqlite.

classes:
  PolarisDemandDatabaseHousehold:
    in_subset:
      - polaris
    description: >-
      Authoritative Household table schema for the POLARIS Demand SQLite database (17 columns).
    aliases:
      - PolarisHousehold
    annotations:
      table_name: Household
      artifact_table: "Household (Demand.sqlite)"
      model_association: POLARIS demand database
      schema_status: authoritative
      status: active
    attributes:
      household:
        range: integer
        identifier: true
        required: true
        description: "Primary household identifier."
      hhold:
        range: integer
        required: true
        description: "Secondary household identifier column retained in POLARIS Demand.sqlite."
      location:
        range: integer
        required: true
        annotations:
          foreign_key: UrbanSimZonalTotals.zone_id
        description: "Residential location zone or activity location identifier."
      persons:
        range: integer
        required: true
        description: "Total number of persons in the household."
      workers:
        range: integer
        required: true
        description: "Number of employed workers in the household."
      vehicles:
        range: integer
        required: true
        description: "Number of vehicles available to the household."
      type:
        range: integer
        required: true
        description: "Household family and tenure classification code (crosswalk X-H2: tenure x HHT, 1..11)."
      income:
        range: integer
        required: true
        description: "Annual household income in integer dollars."
      bikes:
        range: integer
        required: true
        description: "Number of bicycles owned by the household."
      housing_unit_type:
        range: integer
        required: true
        description: "Housing structure type code (crosswalk X-H3: 1=Single Family, 2=Small Apt, 3=Large Apt, 4=Other, 5=GQ)."
      ecom:
        range: integer
        required: true
        description: "Household e-commerce delivery order frequency indicator."
      delRat:
        range: float
        required: false
        description: "Household home-delivery propensity ratio."
      dispose_veh:
        range: integer
        required: false
        description: "Household vehicle disposal count or indicator."
      Has_Residential_Charging:
        range: integer
        required: true
        description: "Residential EV charging availability indicator (0=No, 1=Yes)."
      num_groceries:
        range: integer
        required: true
        description: "Count of household grocery delivery orders."
      num_meals:
        range: integer
        required: true
        description: "Count of household prepared-meal delivery orders."
      time_in_home:
        range: float
        required: false
        description: "Duration of residence in the current home in years."

  PolarisDemandDatabasePerson:
    in_subset:
      - polaris
    description: >-
      Authoritative Person table schema for the POLARIS Demand SQLite database (27 columns).
    aliases:
      - PolarisPerson
    annotations:
      table_name: Person
      artifact_table: "Person (Demand.sqlite)"
      model_association: POLARIS demand database
      schema_status: authoritative
      status: active
    attributes:
      person:
        range: integer
        identifier: true
        required: true
        description: "Primary person identifier."
      household:
        range: integer
        required: true
        annotations:
          relationship_target: PolarisDemandDatabaseHousehold.household
          foreign_key: PolarisDemandDatabaseHousehold.household
          validation_boundary: external conformance check, not a SQLite foreign key
        description: "Household identifier joining to Household.household."
      id:
        range: integer
        required: true
        description: "Zero-based within-household person sequence index (0..n-1)."
      school_location_id:
        range: integer
        required: true
        description: "Assigned school activity location identifier (-1 if unassigned before destination choice)."
      work_location_id:
        range: integer
        required: true
        description: "Assigned workplace activity location identifier (-1 if unassigned before destination choice)."
      age:
        range: integer
        required: true
        description: "Person age in years."
      worker_class:
        range: integer
        required: true
        description: "Class of worker code (ACS COW: 0..9)."
      education:
        range: integer
        required: true
        description: "Educational attainment level code (ACS SCHL: 0..24)."
      industry:
        range: integer
        required: true
        description: "Employment industry sector code (ACS INDP)."
      employment:
        range: integer
        required: true
        description: "Employment status code (crosswalk X-P2 / ACS ESR: 0..6)."
      gender:
        range: integer
        required: true
        description: "Sex/gender code (crosswalk X-P1: 1=Male, 2=Female)."
      income:
        range: integer
        required: true
        description: "Annual individual personal income in integer dollars."
      journey_to_work_arrival_time:
        range: integer
        required: true
        description: "Usual work commute arrival time in minutes after midnight."
      journey_to_work_mode:
        range: integer
        required: true
        description: "Usual work commute transportation mode code."
      journey_to_work_travel_time:
        range: integer
        required: true
        description: "Usual one-way work commute travel time in minutes."
      journey_to_work_vehicle_occupancy:
        range: integer
        required: true
        description: "Vehicle occupancy count for work commute trips."
      marital_status:
        range: integer
        required: true
        description: "Marital status code (crosswalk X-P1: 1=Married, 2=Widowed, 3=Divorced, 4=Separated, 5=Never married)."
      race:
        range: integer
        required: true
        description: "Race category code (crosswalk X-P1: 1..9)."
      school_enrollment:
        range: integer
        required: true
        description: "School enrollment status (crosswalk X-P1: 0=NA, 1=None, 2=Public, 3=Private)."
      school_grade_level:
        range: integer
        required: true
        description: "Enrolled school grade level code (crosswalk X-P3: 0..16)."
      work_hours:
        range: integer
        required: true
        description: "Usual weekly hours worked."
      telecommute_level:
        range: integer
        required: true
        description: "Telecommute frequency level (0..5 days/week)."
      transit_pass:
        range: integer
        required: false
        description: "Transit pass ownership indicator."
      disability:
        range: integer
        required: true
        description: "Disability status code (crosswalk X-P1: 1=With disability, 2=Without disability)."
      time_in_job:
        range: float
        required: false
        description: "Tenure in current job in years."
      is_long_term_chooser:
        range: integer
        required: false
        description: "Flag marking agents scheduled for long-term workplace or school choice evaluation (0=No, 1=Yes)."
      escooter_use_level:
        range: integer
        required: true
        description: "Shared e-scooter usage frequency level (0..3)."

  PolarisDemandDatabaseVehicle:
    in_subset:
      - polaris
    description: >-
      Authoritative Vehicle table schema for the POLARIS Demand SQLite database (8 columns).
    aliases:
      - PolarisVehicle
    annotations:
      table_name: Vehicle
      artifact_table: "Vehicle (Demand.sqlite)"
      model_association: POLARIS demand database
      schema_status: authoritative
      status: active
    attributes:
      vehicle_id:
        range: integer
        identifier: true
        required: true
        description: "Unique vehicle identifier."
      hhold:
        range: integer
        required: true
        annotations:
          relationship_target: PolarisDemandDatabaseHousehold.household
          foreign_key: PolarisDemandDatabaseHousehold.household
          validation_boundary: external conformance check, not a SQLite foreign key
        description: "Owning household or commercial establishment identifier."
      parking:
        range: integer
        required: true
        description: "Home parking arrangement code."
      L3_wtp:
        range: integer
        required: true
        description: "Willingness-to-pay for Level 3 vehicle automation."
      L4_wtp:
        range: integer
        required: true
        description: "Willingness-to-pay for Level 4 vehicle automation."
      type:
        range: integer
        required: false
        annotations:
          relationship_target: PolarisDemandDatabaseVehicleType.type_id
          foreign_key: PolarisDemandDatabaseVehicleType.type_id
          validation_boundary: external conformance check, not a SQLite foreign key
        description: "Foreign key referencing Vehicle_Type.type_id."
      fleet:
        range: integer
        required: false
        description: "Fleet ownership classification code (0=Household, >0=Commercial/Fleet)."
      subtype:
        range: integer
        required: true
        description: "Vehicle subtype classification code."

  PolarisDemandDatabaseVehicleClass:
    in_subset:
      - polaris
    description: >-
      Authoritative Vehicle_Class dimension table schema in the POLARIS Demand SQLite database (8 columns).
    aliases:
      - PolarisVehicleClass
    annotations:
      table_name: Vehicle_Class
      artifact_table: "Vehicle_Class (Demand.sqlite)"
      model_association: POLARIS demand database
      schema_status: authoritative
      status: active
    attributes:
      class_id:
        range: integer
        identifier: true
        required: true
        description: "Vehicle body/weight class primary key identifier."
      class_type:
        range: string
        required: true
        description: "Vehicle class label (e.g. CAR_COMPACT, SUV_FULL_SIZE,HDT_TRACTOR)."
      capacity:
        range: integer
        required: true
        description: "Passenger seating or payload capacity."
      length:
        range: float
        required: false
        description: "Vehicle length in meters."
      max_speed:
        range: float
        required: false
        description: "Maximum vehicle speed."
      max_accel:
        range: float
        required: false
        description: "Maximum vehicle acceleration rate."
      max_decel:
        range: float
        required: false
        description: "Maximum vehicle deceleration rate."
      ev_ml_class:
        range: integer
        required: true
        description: "Electric vehicle energy-consumption machine learning class index."

  PolarisDemandDatabaseVehicleType:
    in_subset:
      - polaris
    description: >-
      Authoritative Vehicle_Type dimension table schema in the POLARIS Demand SQLite database (9 columns).
    aliases:
      - PolarisVehicleType
    annotations:
      table_name: Vehicle_Type
      artifact_table: "Vehicle_Type (Demand.sqlite)"
      model_association: POLARIS demand database
      schema_status: authoritative
      status: active
    attributes:
      type_id:
        range: integer
        identifier: true
        required: true
        description: "Composite vehicle type primary key identifier."
      vehicle_class:
        range: integer
        required: false
        annotations:
          relationship_target: PolarisDemandDatabaseVehicleClass.class_id
          foreign_key: PolarisDemandDatabaseVehicleClass.class_id
          validation_boundary: external conformance check, not a SQLite foreign key
        description: "Reference to Vehicle_Class.class_id."
      connectivity_type:
        range: integer
        required: false
        description: "Vehicle connectivity capability code (crosswalk X-V5: 0=No, 1=Yes)."
      powertrain_type:
        range: integer
        required: false
        description: "Powertrain technology code (crosswalk X-V2 / X-V5: 0=Conventional, 1=HEV, 2=PHEV, 3=BEV_long)."
      automation_type:
        range: integer
        required: false
        description: "Driving automation level code (crosswalk X-V5: 0=L0, 1=L3/4, 2=L5)."
      fuel_type:
        range: integer
        required: false
        description: "Primary fuel type code (crosswalk X-V3 / X-V5: 0=Gas, 1=Diesel, 2=CNG, 3=H2, 4=Electric)."
      vintage_type:
        range: integer
        required: false
        description: "Vehicle age category code (crosswalk X-V4 / X-V5: 0=0-5 yrs, 1=6-10 yrs, 2=10+ yrs)."
      ev_features_id:
        range: integer
        required: false
        description: "Electric vehicle battery and charging profile identifier."
      operating_cost_per_mile:
        range: float
        required: false
        description: "Vehicle operating cost per mile in dollars."

  PolarisHouseholdStateOutput:
    in_subset:
      - polaris
    description: >-
      Provisional post-run household state output schema from POLARIS at the end of a simulation
      year, capturing resolved residential location, residence duration, and household delivery
      choices carried forward to subsequent simulation years.
    aliases:
      - PolarisHouseholdOutput
    annotations:
      table_name: Household
      artifact_table: "Household (Result.sqlite)"
      model_association: POLARIS result / post-run demand database
      schema_status: provisional
      status: provisional_placeholder
    attributes:
      household:
        range: integer
        identifier: true
        required: true
        annotations:
          foreign_key: PolarisDemandDatabaseHousehold.household
        description: "Household primary-key identifier linking post-run state back to the core household."
      location:
        range: integer
        required: true
        annotations:
          foreign_key: UrbanSimZonalTotals.zone_id
        description: "Resolved residential zone or location identifier at the end of the simulation year."
      time_in_home:
        range: float
        required: false
        description: "Updated duration of residence in the current home in years."
      ecom:
        range: integer
        required: true
        description: "Simulated household e-commerce delivery frequency."
      delRat:
        range: float
        required: false
        description: "Simulated household home-delivery propensity ratio."
      dispose_veh:
        range: integer
        required: false
        description: "Simulated vehicle disposal count or indicator."
      num_groceries:
        range: integer
        required: true
        description: "Simulated count of grocery delivery orders."
      num_meals:
        range: integer
        required: true
        description: "Simulated count of prepared-meal delivery orders."

  PolarisPersonStateOutput:
    in_subset:
      - polaris
    description: >-
      Provisional post-run person state output schema from POLARIS at the end of a simulation
      year, capturing resolved workplace and school locations (replacing -1 sentinels),
      realized commute attributes, and mobility choices carried forward to subsequent years.
    aliases:
      - PolarisPersonOutput
    annotations:
      table_name: Person
      artifact_table: "Person (Result.sqlite)"
      model_association: POLARIS result / post-run demand database
      schema_status: provisional
      status: provisional_placeholder
    attributes:
      person:
        range: integer
        identifier: true
        required: true
        annotations:
          foreign_key: PolarisDemandDatabasePerson.person
        description: "Person primary-key identifier linking post-run state back to the core person."
      household:
        range: integer
        required: true
        annotations:
          foreign_key: PolarisDemandDatabaseHousehold.household
        description: "Household identifier for the person."
      work_location_id:
        range: integer
        required: true
        description: "Resolved workplace location identifier replacing the -1 unassigned sentinel."
      school_location_id:
        range: integer
        required: true
        description: "Resolved school location identifier replacing the -1 unassigned sentinel."
      journey_to_work_mode:
        range: integer
        required: true
        description: "Simulated work commute mode code."
      journey_to_work_travel_time:
        range: integer
        required: true
        description: "Simulated one-way work commute travel time in minutes."
      journey_to_work_arrival_time:
        range: integer
        required: true
        description: "Simulated work arrival time in minutes after midnight."
      journey_to_work_vehicle_occupancy:
        range: integer
        required: true
        description: "Simulated work commute vehicle occupancy count."
      telecommute_level:
        range: integer
        required: true
        description: "Simulated telecommute frequency level (0..5 days/week)."
      transit_pass:
        range: integer
        required: false
        description: "Simulated transit pass ownership indicator."
      escooter_use_level:
        range: integer
        required: true
        description: "Simulated shared e-scooter usage frequency level (0..3)."
      time_in_job:
        range: float
        required: false
        description: "Updated tenure in current job in years."
      is_long_term_chooser:
        range: integer
        required: false
        description: "Long-term choice re-evaluation flag, reset to 0 after POLARIS destination choices complete."
