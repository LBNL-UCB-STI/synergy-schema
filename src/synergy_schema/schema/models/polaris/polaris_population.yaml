id: https://w3id.org/LBNL-UCB-STI/synergy-schema/models/polaris/population
name: polaris_population
title: POLARIS population identity and join records
description: >-
  POLARIS-owned partial identity and join record sets used to join translated
  household, person, and vehicle population records in the PILATES workflow.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types

classes:
  PolarisHouseholdRecord:
    description: POLARIS household identity and location fields.
    annotations:
      owner: POLARIS
      coverage: partial identity and join record set
      enforcement_status: PILATES-observed
    attributes:
      household:
        range: integer
        identifier: true
        required: true
        description: POLARIS household identifier.
      hhold:
        range: integer
        required: true
        annotations:
          alias_of: household
        description: Required physical alias of the household identifier.
      location:
        range: integer
        description: Optional household location identifier.

  PolarisPersonRecord:
    description: POLARIS person identity and household-join fields.
    annotations:
      owner: POLARIS
      coverage: partial identity and join record set
      enforcement_status: PILATES-observed
    attributes:
      person:
        range: integer
        identifier: true
        required: true
        description: POLARIS person identifier.
      household:
        range: PolarisHouseholdRecord
        inlined: false
        required: true
        annotations:
          relationship_target: PolarisHouseholdRecord
        description: Household identifier referencing PolarisHouseholdRecord.
      id:
        range: integer
        required: true
        annotations:
          identity_role: zero-based within-household ordinal
        description: Zero-based ordinal identifying the person within a household.

  PolarisVehicleRecord:
    description: >-
      POLARIS vehicle identity and household-join fields. The translation
      drops the ATLAS forecast/output year, so its (hhold, vehicle_id) pair is
      identifiable only within the enclosing PopulationSnapshot artifact scope.
    annotations:
      owner: POLARIS
      coverage: partial identity and join record set
      enforcement_status: PILATES-observed
      identity_scope: enclosing translated population snapshot artifact
    unique_keys:
      polaris_vehicle_row:
        description: >-
          Composite row key within one translated population snapshot artifact;
          full semantic identity also requires the enclosing snapshot year.
        unique_key_slots:
          - hhold
          - vehicle_id
    attributes:
      vehicle_id:
        range: integer
        required: true
        description: >-
          POLARIS vehicle-key component; it is not a globally stable vehicle
          identifier and must be paired with hhold and the enclosing snapshot
          artifact scope.
      hhold:
        range: PolarisHouseholdRecord
        inlined: false
        required: true
        annotations:
          relationship_target: PolarisHouseholdRecord
        description: Household identifier referencing PolarisHouseholdRecord.
