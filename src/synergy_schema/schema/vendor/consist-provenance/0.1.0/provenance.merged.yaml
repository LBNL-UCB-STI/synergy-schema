name: consist_provenance
description: Portable, durable provenance graph assertions for public Consist runs
  and artifacts. This experimental semantic contract is not a complete execution observation
  model, a mirror of the persistence model, or an artifact registry.
title: Consist provenance graph
status: experimental
id: https://w3id.org/consist/provenance
version: 0.1.0
imports:
- linkml:types
license: BSD-3-Clause
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  consist:
    prefix_prefix: consist
    prefix_reference: https://w3id.org/consist/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: consist
default_range: string
types:
  UUID:
    name: UUID
    definition_uri: https://w3id.org/consist/UUID
    description: A canonical RFC 4122 UUID string.
    from_schema: https://w3id.org/consist/provenance
    base: str
    uri: xsd:string
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
  SHA256Digest:
    name: SHA256Digest
    definition_uri: https://w3id.org/consist/SHA256Digest
    description: A lowercase hexadecimal SHA-256 digest.
    from_schema: https://w3id.org/consist/provenance
    base: str
    uri: xsd:string
    pattern: ^[0-9a-f]{64}$
  ConsistArtifactIdentityKind:
    name: ConsistArtifactIdentityKind
    definition_uri: https://w3id.org/consist/ConsistArtifactIdentityKind
    description: Immutable artifact identity contracts Consist can currently attest.
    from_schema: https://w3id.org/consist/provenance
    base: str
    uri: xsd:string
    pattern: ^(file|manifest-v1)$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ConsistArtifactIdentityAlgorithm:
    name: ConsistArtifactIdentityAlgorithm
    definition_uri: https://w3id.org/consist/ConsistArtifactIdentityAlgorithm
    description: Algorithms Consist can currently attest for immutable artifacts.
    from_schema: https://w3id.org/consist/provenance
    permissible_values:
      sha256:
        text: sha256
  ConsistRunArtifactDirection:
    name: ConsistRunArtifactDirection
    definition_uri: https://w3id.org/consist/ConsistRunArtifactDirection
    description: Whether a run consumed or produced an artifact.
    from_schema: https://w3id.org/consist/provenance
    permissible_values:
      input:
        text: input
      output:
        text: output
slots:
  consistProvenanceContext__namespace:
    name: consistProvenanceContext__namespace
    description: A stable logical identifier for the Consist provenance ledger.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:namespace
    alias: namespace
    owner: ConsistProvenanceContext
    domain_of:
    - ConsistProvenanceContext
    range: string
    required: true
  consistProvenanceContext__locator:
    name: consistProvenanceContext__locator
    description: An optional mutable hint for locating the ledger. It is never part
      of identity, equality, deduplication, or namespace assignment.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:locator
    alias: locator
    owner: ConsistProvenanceContext
    domain_of:
    - ConsistProvenanceContext
    range: string
  consistProvenanceDocument__provenance_context:
    name: consistProvenanceDocument__provenance_context
    description: The enclosing context inherited by any contained run or artifact
      reference that omits provenance_context.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:provenance_context
    alias: provenance_context
    owner: ConsistProvenanceDocument
    domain_of:
    - ConsistProvenanceDocument
    range: ConsistProvenanceContext
    required: true
    inlined: true
    inlined_as_list: true
  consistProvenanceDocument__runs:
    name: consistProvenanceDocument__runs
    description: Run references carried by this provenance handoff.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:runs
    alias: runs
    owner: ConsistProvenanceDocument
    domain_of:
    - ConsistProvenanceDocument
    range: ConsistRunReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  consistProvenanceDocument__artifacts:
    name: consistProvenanceDocument__artifacts
    description: Artifact references carried by this provenance handoff.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:artifacts
    alias: artifacts
    owner: ConsistProvenanceDocument
    domain_of:
    - ConsistProvenanceDocument
    range: ConsistArtifactReference
    multivalued: true
    inlined: true
    inlined_as_list: true
  consistProvenanceDocument__associations:
    name: consistProvenanceDocument__associations
    description: Consumption and production graph edges carried by this handoff.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:associations
    alias: associations
    owner: ConsistProvenanceDocument
    domain_of:
    - ConsistProvenanceDocument
    range: ConsistRunArtifactAssociation
    multivalued: true
    inlined: true
    inlined_as_list: true
  consistRunIdentityEvidence__config_hash:
    name: consistRunIdentityEvidence__config_hash
    description: The run configuration hash, when available.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:config_hash
    alias: config_hash
    owner: ConsistRunIdentityEvidence
    domain_of:
    - ConsistRunIdentityEvidence
    range: string
  consistRunIdentityEvidence__input_hash:
    name: consistRunIdentityEvidence__input_hash
    description: The run input hash, when available.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:input_hash
    alias: input_hash
    owner: ConsistRunIdentityEvidence
    domain_of:
    - ConsistRunIdentityEvidence
    range: string
  consistRunIdentityEvidence__git_hash:
    name: consistRunIdentityEvidence__git_hash
    description: The code revision hash recorded by the run, when available.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:git_hash
    alias: git_hash
    owner: ConsistRunIdentityEvidence
    domain_of:
    - ConsistRunIdentityEvidence
    range: string
  consistRunReference__run_id:
    name: consistRunReference__run_id
    description: The public Consist Run.id value.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:run_id
    alias: run_id
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: string
    required: true
  consistRunReference__provenance_context:
    name: consistRunReference__provenance_context
    description: The ledger context for this run. When omitted inside a ConsistProvenanceDocument,
      inherit the enclosing provenance_context.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:provenance_context
    alias: provenance_context
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: ConsistProvenanceContext
    inlined: true
    inlined_as_list: true
  consistRunReference__signature:
    name: consistRunReference__signature
    description: The Consist run signature when available. It supports audit but does
      not replace run_id as the run reference.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:signature
    alias: signature
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: string
  consistRunReference__model_name:
    name: consistRunReference__model_name
    description: The Consist model or workflow name, when available.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:model_name
    alias: model_name
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: string
  consistRunReference__parent_run:
    name: consistRunReference__parent_run
    description: The parent Consist run for a nested execution, when one exists.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:parent_run
    alias: parent_run
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: ConsistRunReference
    inlined: true
    inlined_as_list: true
  consistRunReference__identity_evidence:
    name: consistRunReference__identity_evidence
    description: Optional structured run cache-identity evidence.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:identity_evidence
    alias: identity_evidence
    owner: ConsistRunReference
    domain_of:
    - ConsistRunReference
    range: ConsistRunIdentityEvidence
    inlined: true
    inlined_as_list: true
  consistArtifactIdentity__algorithm:
    name: consistArtifactIdentity__algorithm
    description: The attested immutable identity algorithm.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:algorithm
    alias: algorithm
    owner: ConsistArtifactIdentity
    domain_of:
    - ConsistArtifactIdentity
    range: ConsistArtifactIdentityAlgorithm
    required: true
  consistArtifactIdentity__kind:
    name: consistArtifactIdentity__kind
    description: The attested immutable identity contract.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:kind
    alias: kind
    owner: ConsistArtifactIdentity
    domain_of:
    - ConsistArtifactIdentity
    range: ConsistArtifactIdentityKind
    required: true
  consistArtifactIdentity__digest:
    name: consistArtifactIdentity__digest
    description: The immutable identity digest.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:digest
    alias: digest
    owner: ConsistArtifactIdentity
    domain_of:
    - ConsistArtifactIdentity
    range: SHA256Digest
    required: true
  consistArtifactReference__artifact_id:
    name: consistArtifactReference__artifact_id
    description: The public Consist Artifact.id UUID.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:artifact_id
    alias: artifact_id
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: UUID
    required: true
  consistArtifactReference__provenance_context:
    name: consistArtifactReference__provenance_context
    description: The ledger context for this artifact. When omitted inside a ConsistProvenanceDocument,
      inherit the enclosing provenance_context.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:provenance_context
    alias: provenance_context
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: ConsistProvenanceContext
    inlined: true
    inlined_as_list: true
  consistArtifactReference__artifact_key:
    name: consistArtifactReference__artifact_key
    description: The human-readable Consist artifact key, when known.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:artifact_key
    alias: artifact_key
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: string
  consistArtifactReference__fingerprint:
    name: consistArtifactReference__fingerprint
    description: The public Artifact.hash value. It is a portable fingerprint whose
      interpretation follows the hashing strategy and may be content- or metadata-based.
      Artifact.content_id is database-local and is never a portable fingerprint.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:fingerprint
    alias: fingerprint
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: string
  consistArtifactReference__fingerprint_strategy:
    name: consistArtifactReference__fingerprint_strategy
    description: The hashing strategy or interpretation for fingerprint, when known.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:fingerprint_strategy
    alias: fingerprint_strategy
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: string
  consistArtifactReference__immutable_identity:
    name: consistArtifactReference__immutable_identity
    description: A trusted typed immutable identity, when Consist can attest one.
      It must not be inferred from a broader Artifact.hash alone.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:immutable_identity
    alias: immutable_identity
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: ConsistArtifactIdentity
    inlined: true
    inlined_as_list: true
  consistArtifactReference__parent_artifact:
    name: consistArtifactReference__parent_artifact
    description: The parent container artifact, when this artifact is a member. This
      is container structure, not an artifact derivation edge.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:parent_artifact
    alias: parent_artifact
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: ConsistArtifactReference
    inlined: true
    inlined_as_list: true
  consistArtifactReference__producing_run:
    name: consistArtifactReference__producing_run
    description: The Consist run that produced this artifact, when one exists. For
      an output association, this reference must resolve to the associated run. Leave
      it absent for an external artifact with no producing Consist run.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:producing_run
    alias: producing_run
    owner: ConsistArtifactReference
    domain_of:
    - ConsistArtifactReference
    range: ConsistRunReference
    inlined: true
    inlined_as_list: true
  consistRunArtifactAssociation__run:
    name: consistRunArtifactAssociation__run
    description: The consuming or producing Consist run.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:run
    alias: run
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: ConsistRunReference
    required: true
    inlined: true
    inlined_as_list: true
  consistRunArtifactAssociation__artifact:
    name: consistRunArtifactAssociation__artifact
    description: The consumed or produced Consist artifact.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:artifact
    alias: artifact
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: ConsistArtifactReference
    required: true
    inlined: true
    inlined_as_list: true
  consistRunArtifactAssociation__direction:
    name: consistRunArtifactAssociation__direction
    description: Whether the run used the artifact as an input or output.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:direction
    alias: direction
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: ConsistRunArtifactDirection
    required: true
  consistRunArtifactAssociation__role:
    name: consistRunArtifactAssociation__role
    description: The invocation-specific semantic role of the artifact, when known.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:role
    alias: role
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: string
  consistRunArtifactAssociation__binding_parameter:
    name: consistRunArtifactAssociation__binding_parameter
    description: The invocation binding parameter for the artifact, when known.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:binding_parameter
    alias: binding_parameter
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: string
  consistRunArtifactAssociation__is_implicit:
    name: consistRunArtifactAssociation__is_implicit
    description: Whether Consist discovered this relationship implicitly, when that
      evidence is available.
    from_schema: https://w3id.org/consist/provenance
    slot_uri: consist:is_implicit
    alias: is_implicit
    owner: ConsistRunArtifactAssociation
    domain_of:
    - ConsistRunArtifactAssociation
    range: boolean
classes:
  ConsistProvenanceContext:
    name: ConsistProvenanceContext
    definition_uri: https://w3id.org/consist/ConsistProvenanceContext
    description: The ledger context for portable Consist references. Namespace and
      a local ID form identity; locator is mutable retrieval metadata and never identity-bearing.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistProvenanceContext__namespace
    - consistProvenanceContext__locator
    attributes:
      namespace:
        name: namespace
        description: A stable logical identifier for the Consist provenance ledger.
        required: true
      locator:
        name: locator
        description: An optional mutable hint for locating the ledger. It is never
          part of identity, equality, deduplication, or namespace assignment.
    class_uri: consist:ConsistProvenanceContext
  ConsistProvenanceDocument:
    name: ConsistProvenanceDocument
    definition_uri: https://w3id.org/consist/ConsistProvenanceDocument
    description: A portable provenance handoff with one enclosing ledger context and
      graph facts. A record that omits provenance_context inherits this context.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistProvenanceDocument__provenance_context
    - consistProvenanceDocument__runs
    - consistProvenanceDocument__artifacts
    - consistProvenanceDocument__associations
    attributes:
      provenance_context:
        name: provenance_context
        description: The enclosing context inherited by any contained run or artifact
          reference that omits provenance_context.
        range: ConsistProvenanceContext
        required: true
        inlined: true
      runs:
        name: runs
        description: Run references carried by this provenance handoff.
        range: ConsistRunReference
        multivalued: true
        inlined_as_list: true
      artifacts:
        name: artifacts
        description: Artifact references carried by this provenance handoff.
        range: ConsistArtifactReference
        multivalued: true
        inlined_as_list: true
      associations:
        name: associations
        description: Consumption and production graph edges carried by this handoff.
        range: ConsistRunArtifactAssociation
        multivalued: true
        inlined_as_list: true
    class_uri: consist:ConsistProvenanceDocument
  ConsistRunIdentityEvidence:
    name: ConsistRunIdentityEvidence
    definition_uri: https://w3id.org/consist/ConsistRunIdentityEvidence
    description: Optional cache-identity components copied from a Consist Run for
      audit. These values support comparison but do not replace a run's public ID.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistRunIdentityEvidence__config_hash
    - consistRunIdentityEvidence__input_hash
    - consistRunIdentityEvidence__git_hash
    attributes:
      config_hash:
        name: config_hash
        description: The run configuration hash, when available.
      input_hash:
        name: input_hash
        description: The run input hash, when available.
      git_hash:
        name: git_hash
        description: The code revision hash recorded by the run, when available.
    class_uri: consist:ConsistRunIdentityEvidence
  ConsistRunReference:
    name: ConsistRunReference
    definition_uri: https://w3id.org/consist/ConsistRunReference
    description: A portable reference to a public Consist Run record. Its identity
      is provenance_context.namespace plus run_id. If provenance_context is absent,
      it inherits the enclosing ConsistProvenanceDocument provenance_context.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistRunReference__run_id
    - consistRunReference__provenance_context
    - consistRunReference__signature
    - consistRunReference__model_name
    - consistRunReference__parent_run
    - consistRunReference__identity_evidence
    attributes:
      run_id:
        name: run_id
        description: The public Consist Run.id value.
        required: true
      provenance_context:
        name: provenance_context
        description: The ledger context for this run. When omitted inside a ConsistProvenanceDocument,
          inherit the enclosing provenance_context.
        range: ConsistProvenanceContext
        inlined: true
      signature:
        name: signature
        description: The Consist run signature when available. It supports audit but
          does not replace run_id as the run reference.
      model_name:
        name: model_name
        description: The Consist model or workflow name, when available.
      parent_run:
        name: parent_run
        description: The parent Consist run for a nested execution, when one exists.
        range: ConsistRunReference
        inlined: true
      identity_evidence:
        name: identity_evidence
        description: Optional structured run cache-identity evidence.
        range: ConsistRunIdentityEvidence
        inlined: true
    class_uri: consist:ConsistRunReference
  ConsistArtifactIdentity:
    name: ConsistArtifactIdentity
    definition_uri: https://w3id.org/consist/ConsistArtifactIdentity
    description: A trusted, typed immutable identity that Consist can attest for a
      strict bound artifact. It is stronger and narrower than Artifact.hash.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistArtifactIdentity__algorithm
    - consistArtifactIdentity__kind
    - consistArtifactIdentity__digest
    attributes:
      algorithm:
        name: algorithm
        description: The attested immutable identity algorithm.
        range: ConsistArtifactIdentityAlgorithm
        required: true
      kind:
        name: kind
        description: The attested immutable identity contract.
        range: ConsistArtifactIdentityKind
        required: true
      digest:
        name: digest
        description: The immutable identity digest.
        range: SHA256Digest
        required: true
    class_uri: consist:ConsistArtifactIdentity
  ConsistArtifactReference:
    name: ConsistArtifactReference
    definition_uri: https://w3id.org/consist/ConsistArtifactReference
    description: A portable reference to a public Consist Artifact record, including
      optional portable fingerprint, trusted immutable identity, parent container
      relationship, and producing run.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistArtifactReference__artifact_id
    - consistArtifactReference__provenance_context
    - consistArtifactReference__artifact_key
    - consistArtifactReference__fingerprint
    - consistArtifactReference__fingerprint_strategy
    - consistArtifactReference__immutable_identity
    - consistArtifactReference__parent_artifact
    - consistArtifactReference__producing_run
    attributes:
      artifact_id:
        name: artifact_id
        description: The public Consist Artifact.id UUID.
        range: UUID
        required: true
      provenance_context:
        name: provenance_context
        description: The ledger context for this artifact. When omitted inside a ConsistProvenanceDocument,
          inherit the enclosing provenance_context.
        range: ConsistProvenanceContext
        inlined: true
      artifact_key:
        name: artifact_key
        description: The human-readable Consist artifact key, when known.
      fingerprint:
        name: fingerprint
        description: The public Artifact.hash value. It is a portable fingerprint
          whose interpretation follows the hashing strategy and may be content- or
          metadata-based. Artifact.content_id is database-local and is never a portable
          fingerprint.
      fingerprint_strategy:
        name: fingerprint_strategy
        description: The hashing strategy or interpretation for fingerprint, when
          known.
      immutable_identity:
        name: immutable_identity
        description: A trusted typed immutable identity, when Consist can attest one.
          It must not be inferred from a broader Artifact.hash alone.
        range: ConsistArtifactIdentity
        inlined: true
      parent_artifact:
        name: parent_artifact
        description: The parent container artifact, when this artifact is a member.
          This is container structure, not an artifact derivation edge.
        range: ConsistArtifactReference
        inlined: true
      producing_run:
        name: producing_run
        description: The Consist run that produced this artifact, when one exists.
          For an output association, this reference must resolve to the associated
          run. Leave it absent for an external artifact with no producing Consist
          run.
        range: ConsistRunReference
        inlined: true
    class_uri: consist:ConsistArtifactReference
  ConsistRunArtifactAssociation:
    name: ConsistRunArtifactAssociation
    definition_uri: https://w3id.org/consist/ConsistRunArtifactAssociation
    description: A durable input or output relationship between a run and an artifact.
      An output association is a production assertion; if artifact.producing_run is
      supplied, it must resolve to the same run after context inheritance.
    from_schema: https://w3id.org/consist/provenance
    slots:
    - consistRunArtifactAssociation__run
    - consistRunArtifactAssociation__artifact
    - consistRunArtifactAssociation__direction
    - consistRunArtifactAssociation__role
    - consistRunArtifactAssociation__binding_parameter
    - consistRunArtifactAssociation__is_implicit
    attributes:
      run:
        name: run
        description: The consuming or producing Consist run.
        range: ConsistRunReference
        required: true
        inlined: true
      artifact:
        name: artifact
        description: The consumed or produced Consist artifact.
        range: ConsistArtifactReference
        required: true
        inlined: true
      direction:
        name: direction
        description: Whether the run used the artifact as an input or output.
        range: ConsistRunArtifactDirection
        required: true
      role:
        name: role
        description: The invocation-specific semantic role of the artifact, when known.
      binding_parameter:
        name: binding_parameter
        description: The invocation binding parameter for the artifact, when known.
      is_implicit:
        name: is_implicit
        description: Whether Consist discovered this relationship implicitly, when
          that evidence is available.
        range: boolean
    class_uri: consist:ConsistRunArtifactAssociation
