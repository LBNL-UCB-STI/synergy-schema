id: https://w3id.org/LBNL-UCB-STI/synergy-schema/core/population-snapshot
name: population_snapshot
title: Population snapshot context
description: >-
  Shared context for one population state at a particular simulation time. This
  context is intentionally separate from model-owned household, person, and
  vehicle record definitions.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types
  - scenario_definition

classes:
  PopulationSnapshot:
    description: >-
      A scenario-specific population state for one simulation year and one
      stochastic realization. A parent snapshot reference can later connect
      this snapshot to a trajectory or derived population bundle.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable identifier for this semantic population snapshot.
      scenario_definition_ref:
        range: ScenarioDefinitionReference
        required: true
        inlined: true
        description: >-
          Immutable scenario definition identity that produced this snapshot.
      stochastic_realization_id:
        required: true
        description: Identifier for the stochastic realization represented by this snapshot.
      simulation_year:
        range: integer
        required: true
        description: Simulation year represented by this snapshot.
      equilibrium_iteration:
        range: integer
        description: Optional equilibrium iteration for this population state.
      parent_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: >-
          Optional reference to an earlier population snapshot. It is a
          reference, not an assertion that standard LinkML validation can
          resolve the referenced snapshot.
  HouseholdState:
    description: >-
      One household occurrence in a particular PopulationSnapshot. Native
      household tables own demographic, income, vehicle, location, and code
      fields; this shared class records only the snapshot-scoped identity and
      optional longitudinal linkage.
    attributes:
      household_state_id:
        identifier: true
        required: true
        description: Typed identifier for this household occurrence in one population snapshot.
      population_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        required: true
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: >-
          Reference to the PopulationSnapshot in which this household occurs.
          It is a reference, not an assertion that standard LinkML validation
          can resolve the referenced snapshot.
      longitudinal_household_ref:
        description: >-
          Optional reference to a household identity preserved across snapshots
          by a producer. Its presence does not assert that all producers retain
          longitudinal household identity.
      predecessor_state_refs:
        range: HouseholdState
        multivalued: true
        inlined: false
        annotations:
          relationship_target: HouseholdState
          validation_boundary: >-
            LinkML validates these reference values' shapes, not whether their
            targets are co-present, occur earlier in a trajectory, or represent
            a valid split or merge. Those relationship checks belong to
            conformance code.
        description: >-
          Optional references to prior household occurrences preserved by a
          producer. Multiple successor households may reference one predecessor
          after a household split.
  PersonState:
    description: >-
      One person occurrence in a particular PopulationSnapshot. Native person
      tables own demographic, activity, location, and code fields; this shared
      class records only the snapshot-scoped identity and optional longitudinal
      linkage.
    attributes:
      person_state_id:
        identifier: true
        required: true
        description: Typed identifier for this person occurrence in one population snapshot.
      population_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        required: true
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: >-
          Reference to the PopulationSnapshot in which this person occurs. It
          is a reference, not an assertion that standard LinkML validation can
          resolve the referenced snapshot.
      longitudinal_person_ref:
        description: >-
          Optional reference to a person identity preserved across snapshots by
          a producer. Its presence does not assert that all producers retain
          longitudinal person identity.
  HouseholdMembership:
    description: >-
      Snapshot-scoped relationship placing one PersonState in one
      HouseholdState. A higher-level population-bundle validator must verify
      that the referenced states are co-present, share this snapshot, and meet
      any producer-specific cardinality policy.
    attributes:
      household_membership_id:
        identifier: true
        required: true
        description: Typed identifier for this snapshot-scoped membership occurrence.
      population_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        required: true
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: >-
          Reference to the PopulationSnapshot in which this membership occurs.
          It is a reference, not an assertion that standard LinkML validation
          can resolve the referenced snapshot.
      person_state_ref:
        range: PersonState
        inlined: false
        required: true
        annotations:
          relationship_target: PersonState
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PersonState is co-present or belongs to the declared snapshot.
        description: Reference to the member PersonState.
      household_state_ref:
        range: HouseholdState
        inlined: false
        required: true
        annotations:
          relationship_target: HouseholdState
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            HouseholdState is co-present or belongs to the declared snapshot.
        description: Reference to the containing HouseholdState.
  VehicleState:
    description: >-
      One vehicle occurrence in a particular PopulationSnapshot. Native vehicle
      records own technology, acquisition, and model-specific attributes; this
      shared class records only snapshot-scoped and optional longitudinal
      identity.
    attributes:
      vehicle_state_id:
        identifier: true
        required: true
        description: Typed identifier for this vehicle occurrence in one population snapshot.
      population_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        required: true
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: >-
          Reference to the PopulationSnapshot in which this vehicle occurs. It
          is a reference, not an assertion that standard LinkML validation can
          resolve the referenced snapshot.
      longitudinal_vehicle_ref:
        description: >-
          Optional reference to a vehicle identity preserved across snapshots by
          a producer. Its presence does not assert that all producers retain
          longitudinal vehicle identity.
  HouseholdVehicleAssignment:
    description: >-
      Snapshot-scoped relationship between one VehicleState and one
      HouseholdState. A higher-level population-bundle validator must verify
      that the referenced states are co-present and share this snapshot.
    attributes:
      household_vehicle_assignment_id:
        identifier: true
        required: true
        description: Typed identifier for this snapshot-scoped vehicle relationship.
      population_snapshot_ref:
        range: PopulationSnapshot
        inlined: false
        required: true
        annotations:
          relationship_target: PopulationSnapshot
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            PopulationSnapshot is co-present.
        description: Reference to the PopulationSnapshot in which this relationship occurs.
      household_state_ref:
        range: HouseholdState
        inlined: false
        required: true
        annotations:
          relationship_target: HouseholdState
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            HouseholdState is co-present or belongs to the declared snapshot.
            Those relationship checks belong to conformance code.
        description: Reference to the related HouseholdState.
      vehicle_state_ref:
        range: VehicleState
        inlined: false
        required: true
        annotations:
          relationship_target: VehicleState
          validation_boundary: >-
            LinkML validates this value's shape, not whether the referenced
            VehicleState is co-present or belongs to the declared snapshot.
            Those relationship checks belong to conformance code.
        description: Reference to the related VehicleState.
      relationship_kind:
        range: HouseholdVehicleRelationshipKind
        required: true
        description: Relationship evidence reported by the native population records.

enums:
  HouseholdVehicleRelationshipKind:
    description: >-
      Relationship described by native evidence between a household and a
      vehicle occurrence in one snapshot.
    permissible_values:
      ownership: {}
      leasing: {}
      availability: {}
      assignment: {}
      unresolved: {}
