id: https://w3id.org/LBNL-UCB-STI/synergy-schema/core/population-trajectory
name: population_trajectory
title: Provider-neutral population trajectories
description: >-
  Shared metadata for evolving population snapshots. This vocabulary records
  snapshot occurrences and their declared relationships without defining
  native-model demographics, vehicle technology, or workflow-provider details.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types
  - handoff_bundle
  - population_snapshot

classes:
  SkippedPopulationYear:
    description: >-
      One requested population handoff year for which no snapshot was
      successfully produced, together with the producer's reason.
    attributes:
      year:
        range: integer
        required: true
        description: Requested simulation year that has no successful snapshot.
      reason:
        required: true
        description: Producer-declared reason the requested year was skipped.
  PopulationTrajectory:
    description: >-
      Ordered population snapshots for one immutable scenario definition and
      one stochastic realization. Successful years are derived from snapshots,
      rather than stored separately.
    annotations:
      conformance_requirements: >-
        Snapshot years must be ordered and unique; every snapshot must use this
        scenario_definition_ref and stochastic_realization_id; parent snapshot
        references, when supplied, must point earlier in the declared order;
        requested, successful, and skipped years must agree with
        completeness_status. Successful years are derived from snapshots.
        These cross-record and cross-field rules are enforced by conformance
        code rather than standard LinkML validation.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable identifier for this semantic population trajectory.
      scenario_definition_ref:
        range: ScenarioDefinitionReference
        required: true
        inlined: true
        description: Immutable scenario definition shared by every snapshot.
      stochastic_realization_id:
        required: true
        description: Identifier for the single stochastic realization in this trajectory.
      snapshots:
        range: PopulationSnapshot
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined_as_list: true
        annotations:
          sequence_semantics: >-
            List order is the declared chronological order; conformance code
            checks that simulation_year values are strictly increasing.
        description: Ordered inlined metadata for successful population snapshots.
      requested_years:
        range: integer
        required: true
        multivalued: true
        minimum_cardinality: 1
        description: Explicit population handoff milestones requested by the workflow.
      skipped_years:
        range: SkippedPopulationYear
        multivalued: true
        inlined_as_list: true
        description: Requested years with no successful snapshot and their reasons.
      completeness_status:
        range: HandoffCompletenessStatus
        required: true
        description: Producer-declared completeness of the requested trajectory.
