id: https://w3id.org/LBNL-UCB-STI/synergy-schema/population-ledger
name: population_ledger
title: Population ledger
description: >-
  Provisional draft for review. A versioned record of one population as
  several models edit it in turn, modeled on git. A PopulationSnapshot is a
  commit: it names the model step that produced it, the snapshot(s) it was
  built from, and the full core population state afterward. A CoreState is
  the commit's tree: a map from each core facet to a content digest. A PopulationCheckpoint is a tag naming the snapshot that
  counts as a given year's population. Models never read or write core
  tables directly; they read and write model-owned views, and Synergy
  mappings derive core facets from those views.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types
  - ../core/handoff_bundle
  - ../core/scenario_definition
  - ../mappings/population_translation

types:
  FacetContentDigest:
    typeof: string
    pattern: "^sha256:[0-9a-f]{64}$"
    description: >-
      Identity of one core facet's content: the rows of its core table class,
      normalized under the ledger's facet_digest_form and then hashed. It is
      not a hash of file bytes, so the same rows read from different models'
      files, or rebuilt from a parent facet and a delta, give the same
      digest. File-byte identity uses ImmutableArtifactIdentity instead.
  StateDigest:
    typeof: string
    pattern: "^sha256:[0-9a-f]{64}$"
    description: >-
      Identity of a whole CoreState: a hash over its sorted (facet, facet
      content digest) pairs under the ledger's state_digest_form, like a git
      tree hash. No file is read to compute it.

enums:
  CoreFacet:
    description: >-
      Shared population facts that every model must agree on within one
      state. Test for membership: two models cannot legitimately disagree
      about it at the same moment. Other facets (buildings, firms, jobs,
      freight) can be added later.
    permissible_values:
      households:
        description: Which households exist.
      people:
        description: Which people exist (alive and in the population).
      household_membership:
        description: Which household each person belongs to.
      vehicles:
        description: Which vehicles exist, and which household each belongs to.

classes:
  ModelView:
    description: >-
      One model-owned artifact read or written by a model step, such as the
      ATLAS household input or the DEMOS persons output. Views may hold any
      model-specific columns; the owning model is the step's model.
    attributes:
      view_id:
        identifier: true
        required: true
        description: Stable identifier for this view occurrence.
      view_kind:
        required: true
        description: >-
          Model-scoped name for the kind of view, such as atlas/household_input
          or demos/persons_output.
      artifact:
        range: PhysicalArtifactReference
        required: true
        inlined: true
        description: Physical artifact holding the view's rows.
      schema_contract:
        range: SchemaContractReference
        inlined: true
        description: Optional contract describing the view's columns.
      prepared_from_state:
        range: StateDigest
        description: >-
          For input views, the state Synergy prepared the view from, recorded
          when it was built; it must equal a parent's state_digest, which
          catches a model run on an out-of-date input. Omitted for output
          views.

  CoreFacetMapping:
    description: >-
      How Synergy derives one core facet from a model's output views. Mappings
      are fixed system knowledge, kept in a CoreFacetMappingCatalog and cited
      by ID from ledgers. Inputs may include the parent's content for some
      facets, for steps whose views are partial (a deaths-only delta, or a
      view missing a key column).
    annotations:
      conformance_requirements: >-
        Every attribute of the facet's core table class must come from at
        least one field binding or input facet; when an attribute has more
        than one source, rule must say how they combine. Each binding's
        view_kind must appear in input_view_kinds.
    rules:
      - description: A mapping with column bindings must name the view kinds it reads.
        preconditions:
          slot_conditions:
            field_bindings:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            input_view_kinds:
              required: true
    attributes:
      mapping_id:
        identifier: true
        required: true
        description: Stable identifier for this mapping, such as mapping:demos-core/v1#people.
      facet:
        range: CoreFacet
        required: true
        description: Core facet this mapping produces.
      input_view_kinds:
        multivalued: true
        description: Kinds of model output view the mapping reads, such as demos/deaths_output.
      input_facets:
        range: CoreFacet
        multivalued: true
        description: >-
          Core facets whose parent content the mapping starts from or joins
          against. Their digests are fixed by the parent state, so derivations
          don't repeat them.
      field_bindings:
        range: CoreFieldFromView
        multivalued: true
        inlined_as_list: true
        description: View columns supplying fields of the facet's core table.
      rule:
        description: >-
          Plain-language rule for combining the inputs when it is not a direct
          copy, such as "parent people minus person_id values in the deaths
          output" or a join across two views.
      translation_contract:
        range: PopulationTranslationContractReference
        inlined: true
        description: >-
          Optional reviewed translation contract holding the full rules,
          residues, and approvals behind this mapping.

  CoreFieldFromView:
    description: One view column supplying one field of a core table.
    attributes:
      view_kind:
        required: true
        description: Kind of view holding the column.
      view_column:
        required: true
        description: Column name in the view, resolved against the view's schema_contract.
      core_field:
        required: true
        description: >-
          Attribute of the facet's core table class, such as household_id on
          CoreHouseholdMembership.
      transformation:
        description: >-
          Optional plain-language rule when the value is not copied directly,
          such as a cast or an ID prefix.

  CoreFacetMappingCatalog:
    description: >-
      Versioned set of CoreFacetMappings, maintained separately from any run
      and cited by ledgers.
    attributes:
      catalog_id:
        identifier: true
        required: true
        description: Stable identifier for this catalog revision.
      mappings:
        range: CoreFacetMapping
        multivalued: true
        required: true
        inlined_as_list: true
        description: Mappings in this catalog.

  FacetDerivation:
    description: >-
      One core facet produced by a step: the mapping applied and the step's
      output views it read. Parent facet content named by the mapping's
      input_facets comes from the parent state.
    attributes:
      facet:
        range: CoreFacet
        required: true
        description: Core facet produced.
      mapping:
        required: true
        description: ID of the CoreFacetMapping applied, from the ledger's mapping catalog.
      views:
        range: ModelView
        multivalued: true
        inlined: false
        description: Output views of this step the facet was derived from.

  CoreFacetEntry:
    description: >-
      One established core facet within a CoreState (a git tree entry). A
      facet absent from a CoreState has not been established yet; a facet
      established as empty is present, with the digest of the empty
      canonical table. How the content was produced is recorded on the step
      that produced it, not here.
    attributes:
      facet:
        range: CoreFacet
        required: true
        description: Core facet described by this entry.
      digest:
        range: FacetContentDigest
        required: true
        description: Content identity of the facet.
      stored_object:
        range: PhysicalArtifactReference
        inlined: true
        description: >-
          Optional materialized core table: its byte identity and, optionally,
          a locator. Lets a consumer start from the stored table instead of
          replaying a chain of delta derivations.

  CoreState:
    description: >-
      The whole core population at one point (the git tree). Its state_digest
      depends only on the facet digests, so identical populations share a
      state digest across steps, years, and scenarios.
    annotations:
      conformance_requirements: >-
        Each facet appears at most once; state_digest must be recomputable
        from the facet entries.
    attributes:
      state_digest:
        range: StateDigest
        required: true
        description: Content identity of the full set of facet digests.
      facets:
        range: CoreFacetEntry
        multivalued: true
        inlined_as_list: true
        description: Established core facets; absent facets are not yet established.

  ModelStep:
    description: >-
      One model run within a snapshot: the views it read and wrote, the core
      facets its inputs depended on, and the core facets it produced. The
      derivations are the step's write set. When a model changes the same
      facet through several views in a fixed order (for example marriages,
      then moves), record each as its own step and snapshot so the order is
      explicit and each intermediate state has a digest.
    attributes:
      model:
        required: true
        description: Model that ran this step and owns its views.
      producing_run:
        range: ProducingRunReference
        required: true
        inlined: true
        description: Provenance reference for the run, such as a Consist run.
      input_views:
        range: ModelView
        multivalued: true
        inlined_as_list: true
        description: Views the model read.
      output_views:
        range: ModelView
        multivalued: true
        inlined_as_list: true
        description: Views the model wrote.
      reads:
        range: CoreFacet
        multivalued: true
        description: Core facets the step's inputs depended on.
      derivations:
        range: FacetDerivation
        multivalued: true
        inlined_as_list: true
        description: >-
          Core facets this step produced. A derivation may reproduce a facet's
          existing content; every facet whose digest changed must have one.

  PopulationSnapshot:
    description: >-
      One commit in the population ledger: the step that ran, the snapshot(s)
      it was built from, and the full core state afterward. A step that
      changes no core facet still produces a snapshot whose core state equals
      its parent's. Order comes from parent links, not from a stored number.
    annotations:
      conformance_requirements: >-
        Every facet whose digest differs from the parent state must have a
        derivation in step. Every input view's prepared_from_state must equal
        a parent's state_digest. Every facet in step.reads must be established
        in the parent state. Joined parents must not change the same facet
        since their latest common ancestor.
    attributes:
      snapshot_id:
        identifier: true
        required: true
        description: Stable identifier for this snapshot.
      parent_snapshots:
        range: PopulationSnapshot
        multivalued: true
        inlined: false
        description: >-
          Snapshots this one was built from. Empty for the first snapshot in a
          ledger; usually one; more than one only when independent steps are
          joined.
      simulation_year:
        range: integer
        required: true
        description: Simulation year the step belongs to.
      equilibrium_iteration:
        range: integer
        description: >-
          Optional iteration number for feedback loops, which are recorded as a
          sequence of snapshots rather than a cycle.
      step:
        range: ModelStep
        required: true
        inlined: true
        description: Model step that produced this snapshot.
      core_state:
        range: CoreState
        required: true
        inlined: true
        description: Full core population after the step.

  PopulationCheckpoint:
    description: >-
      Named pointer to the snapshot that counts as the population for one
      simulation year (a git tag). Trajectories keep one entry per year by
      pointing at checkpoints; within-year snapshots sit underneath.
    annotations:
      conformance_requirements: >-
        Every facet in the checkpoint's state whose latest derivation used a
        mapping with input_facets must have a stored_object, so rebuilding a
        checkpoint never replays derivations across years.
    attributes:
      simulation_year:
        range: integer
        required: true
        description: Simulation year this checkpoint represents.
      snapshot:
        range: PopulationSnapshot
        inlined: false
        required: true
        description: Snapshot designated as that year's population.

  PopulationLedger:
    description: >-
      All snapshots and checkpoints for one scenario definition and one
      stochastic realization (a branch).
    tree_root: true
    annotations:
      conformance_requirements: >-
        Parent links must form a directed acyclic graph within the ledger;
        checkpoint years must be unique and strictly increasing; each
        checkpoint's snapshot must carry the same simulation_year.
    attributes:
      ledger_id:
        identifier: true
        required: true
        description: Stable identifier for this ledger.
      scenario_definition_ref:
        range: ScenarioDefinitionReference
        required: true
        inlined: true
        description: Scenario definition shared by every snapshot in the ledger.
      stochastic_realization_id:
        required: true
        description: Stochastic realization shared by every snapshot in the ledger.
      facet_digest_form:
        required: true
        pattern: "^core_facet_table/v[0-9]+$"
        description: Normalization rules behind every FacetContentDigest, such as core_facet_table/v1.
      state_digest_form:
        required: true
        pattern: "^core_state/v[0-9]+$"
        description: Rules behind every StateDigest, such as core_state/v1.
      mapping_catalog:
        range: CoreFacetMappingCatalog
        inlined: false
        required: true
        description: ID of the mapping catalog whose mappings derivations cite.
      snapshots:
        range: PopulationSnapshot
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined_as_list: true
        description: Snapshots in the ledger, parents before children.
      checkpoints:
        range: PopulationCheckpoint
        multivalued: true
        inlined_as_list: true
        description: Year-end checkpoints in year order.

  # Core tables. These are Synergy's canonical form for each facet, derived
  # from model views; no model is expected to read or write them directly.
  # Their attributes are exactly what core_facet_table/v1 hashes. Core tables
  # hold only keys; a new shared fact (such as household location) becomes a
  # new facet, established when its first writer runs, rather than a new
  # column on an existing core table.
  CoreHousehold:
    description: One household in the core households facet.
    annotations:
      core_facet: households
    attributes:
      household_id:
        identifier: true
        required: true
        description: Household identifier shared across models within a state.

  CorePerson:
    description: One person in the core people facet.
    annotations:
      core_facet: people
    attributes:
      person_id:
        identifier: true
        required: true
        description: Person identifier shared across models within a state.

  CoreHouseholdMembership:
    description: One person's household in the core household_membership facet.
    annotations:
      core_facet: household_membership
    unique_keys:
      one_household_per_person:
        unique_key_slots: [person_id]
    attributes:
      person_id:
        range: CorePerson
        required: true
        description: Member person.
      household_id:
        range: CoreHousehold
        required: true
        description: Containing household.

  CoreVehicle:
    description: >-
      One vehicle in the core vehicles facet. Provisional key: vehicle_id is
      household-scoped in ATLAS, so a vehicle is identified by
      (household_id, vehicle_id), which also records the vehicle's household.
      A vehicle that changes household appears as a new vehicle until a
      global vehicle identity is agreed; a separate assignment facet can be
      added then.
    annotations:
      core_facet: vehicles
    unique_keys:
      household_vehicle:
        unique_key_slots: [household_id, vehicle_id]
    attributes:
      household_id:
        range: CoreHousehold
        required: true
        description: Household that scopes the vehicle identifier.
      vehicle_id:
        required: true
        description: Vehicle identifier, unique within its household.
