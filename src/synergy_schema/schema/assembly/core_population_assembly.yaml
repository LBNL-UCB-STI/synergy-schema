id: https://w3id.org/LBNL-UCB-STI/synergy-schema/assembly/core-population-assembly
name: core_population_assembly
title: Core population assembly manifests
description: >-
  Logical declarations for assembling immutable model contributions into a
  shared population snapshot. This module annotates existing handoff bundles;
  it does not define native model tables or storage layouts.

prefixes:
  synergy_schema: https://w3id.org/LBNL-UCB-STI/synergy-schema/
  linkml: https://w3id.org/linkml/

default_prefix: synergy_schema
default_range: string

imports:
  - linkml:types
  - ../core/population_snapshot
  - ../core/handoff_bundle
  - ../core/native_contract

enums:
  CorePopulationFacet:
    permissible_values:
      households: {}
      people: {}
      household_membership: {}
      vehicles: {}
      household_vehicle_assignment: {}
  ColumnAuthorityKind:
    description: Logical authority of a native column in a contribution.
    permissible_values:
      core_assertion: {}
      model_view: {}
      carried_through: {}
  CorePopulationAssemblyStatus:
    permissible_values:
      partial: {}
      complete_for_named_consumer: {}

classes:
  ContributionSemanticIdentity:
    description: Versioned, algorithm-tagged identity of a contribution's declared meaning.
    attributes:
      kind:
        required: true
      projection_version:
        required: true
      digest_algorithm:
        range: DigestAlgorithm
        required: true
      content_digest:
        required: true
  CorePopulationContributionReference:
    description: Typed reference to an immutable contribution named by an assembly.
    attributes:
      contribution_id:
        description: Stable identifier of an immutable contribution.
        identifier: true
        required: true
      revision:
        required: true
      semantic_identity:
        description: Digest-pinned semantic identity of a contribution or assembly.
        range: ContributionSemanticIdentity
        required: true
        inlined: true
  CoreFacetFieldReference:
    description: Typed target for a core facet or a field within that facet.
    attributes:
      facet:
        description: Core population facet being addressed.
        range: CorePopulationFacet
        required: true
      field:
        description: Optional named field; omitted when the whole facet is targeted.
  ContributionFieldReference:
    description: Reference to an asserted field binding in one contribution.
    attributes:
      contribution:
        description: Contribution that supplies a binding or resolved value.
        range: CorePopulationContributionReference
        required: true
        inlined: true
      binding_id:
        required: true
  CoreFieldBinding:
    description: Mapping from one native contract element to one declared core target.
    attributes:
      id:
        identifier: true
        required: true
      artifact_member_role:
        description: Semantic role of the artifact member containing a field.
        required: true
      native_element:
        range: NativeContractElementReference
        required: true
        inlined: true
      core_target:
        description: Core facet or field asserted by a native binding.
        range: CoreFacetFieldReference
        required: true
        inlined: true
      assertion_authority:
        description: Party responsible for an asserted core value.
        required: true
  ColumnAuthorityClassification:
    description: Classification of a digest-pinned native contract element in a wide table.
    attributes:
      id:
        identifier: true
        required: true
      native_element:
        range: NativeContractElementReference
        required: true
        inlined: true
      classification:
        description: Declared authority category for a native column.
        range: ColumnAuthorityKind
        required: true
      target:
        description: Core facet or field supplied or resolved by a declaration.
        range: CoreFacetFieldReference
        inlined: true
      upstream_assertion:
        range: ContributionFieldReference
        inlined: true
        description: Required by conformance when classification is carried_through.
  RelationshipBinding:
    description: Declared key mapping for a relationship crossing contribution boundaries.
    attributes:
      id:
        identifier: true
        required: true
      source_contribution:
        description: Contribution containing a relationship source key.
        range: CorePopulationContributionReference
        required: true
        inlined: true
      source_artifact_member_role:
        description: Semantic role of the artifact member containing a source key.
        required: true
      source_key_fields:
        description: Native contract elements forming a relationship source key.
        range: NativeContractElementReference
        required: true
        multivalued: true
        inlined_as_list: true
      target_contribution:
        description: Contribution supplying a relationship target key.
        range: CorePopulationContributionReference
        inlined: true
      target_core:
        description: Core facet addressed by a relationship target key.
        range: CoreFacetFieldReference
        inlined: true
      target_key_fields:
        description: Core fields forming a relationship target key.
        range: CoreFacetFieldReference
        multivalued: true
        inlined_as_list: true
      mapping_reference:
        description: Reviewed mapping or translation identity used to compare the keys.
      relationship_kind:
        required: true
  AssemblySemanticIdentity:
    description: Versioned, algorithm-tagged identity of an assembly's closed declared projection.
    attributes:
      kind:
        required: true
      projection_version:
        required: true
      digest_algorithm:
        range: DigestAlgorithm
        required: true
      content_digest:
        required: true
  SuppliedCoreFacet:
    description: Core facet and authority declared as supplied by an assembly.
    attributes:
      target:
        description: Core facet or field supplied or resolved by a declaration.
        range: CoreFacetFieldReference
        required: true
        inlined: true
      contribution:
        description: Contribution that supplies a binding or resolved value.
        range: CorePopulationContributionReference
        required: true
        inlined: true
      binding:
        description: Binding that supplies a declared core target.
        range: CoreFieldBinding
        required: true
        inlined: true
  FieldResolution:
    description: Explicit reviewed selection among competing assertions for a target and scope.
    attributes:
      id:
        identifier: true
        required: true
      target:
        description: Core facet or field supplied or resolved by a declaration.
        range: CoreFacetFieldReference
        required: true
        inlined: true
      scope:
        description: Scope over which a field-resolution choice applies.
        required: true
      candidate_assertions:
        description: Competing asserted bindings considered for resolution.
        range: ContributionFieldReference
        required: true
        multivalued: true
        inlined_as_list: true
      selected_assertion:
        description: Reviewed assertion selected from the candidate set.
        range: ContributionFieldReference
        required: true
        inlined: true
      reason:
        required: true
      approval:
        description: Review or owner approval authorizing a resolution.
        required: true
  ResolvedFacetIndexEntry:
    description: Materialized authoritative lookup for one supplied core target.
    attributes:
      id:
        identifier: true
        required: true
      target:
        description: Core facet or field supplied or resolved by a declaration.
        range: CoreFacetFieldReference
        required: true
        inlined: true
      contribution:
        description: Contribution that supplies a binding or resolved value.
        range: CorePopulationContributionReference
        required: true
        inlined: true
      artifact_member_role:
        description: Semantic role of the artifact member containing a field.
        required: true
      schema_contract:
        range: SchemaContractReference
        inlined: true
      native_to_core_binding:
        description: Binding used to locate and interpret a resolved core value.
        range: CoreFieldBinding
        required: true
        inlined: true
      field_resolution:
        description: Resolution record used for overlapping core assertions.
        range: FieldResolution
        inlined: true
  CorePopulationContribution:
    is_a: HandoffBundle
    description: Immutable model assertion about one or more facets of a core snapshot.
    attributes:
      contribution_revision:
        description: Immutable revision label assigned to a contribution.
        required: true
      target_snapshot:
        description: Shared population snapshot to which a manifest applies.
        range: PopulationSnapshot
        required: true
        inlined: true
      input_snapshots:
        description: Population snapshots used as contribution inputs.
        range: PopulationSnapshot
        multivalued: true
        inlined: false
      input_contributions:
        description: Earlier immutable contributions used as inputs.
        range: CorePopulationContributionReference
        multivalued: true
        inlined_as_list: true
      producing_model:
        description: Model responsible for the native output.
        required: true
      producing_component:
        description: Model component responsible for the native output.
        required: true
      semantic_identity:
        description: Digest-pinned semantic identity of a contribution or assembly.
        range: ContributionSemanticIdentity
        required: true
        inlined: true
      supplied_bindings:
        description: Native-to-core bindings asserted by a contribution.
        range: CoreFieldBinding
        multivalued: true
        inlined_as_list: true
      column_classifications:
        description: Logical authority classifications for native output columns.
        range: ColumnAuthorityClassification
        multivalued: true
        inlined_as_list: true
      relationship_bindings:
        description: Declared relationships from a contribution to other facets.
        range: RelationshipBinding
        multivalued: true
        inlined_as_list: true
      mapping_reference:
        required: true
      completeness_declaration:
        description: Producer declaration of the contribution's supplied scope.
        required: true
  CorePopulationAssembly:
    description: Immutable inventory of contributions describing one core snapshot revision.
    annotations:
      conformance_requirements: >-
        Contributions must target the same snapshot; overlapping core targets
        require an explicit FieldResolution; and the resolved facet index must
        be recomputable from the declarations. These are conformance rules,
        not ordinary LinkML shape validation.
    attributes:
      id:
        identifier: true
        required: true
      assembly_revision:
        description: Immutable revision label assigned to an assembly manifest.
        required: true
      target_snapshot:
        description: Shared population snapshot to which a manifest applies.
        range: PopulationSnapshot
        required: true
        inlined: true
      contributions:
        description: Immutable contribution identities included in an assembly.
        range: CorePopulationContributionReference
        required: true
        minimum_cardinality: 1
        multivalued: true
        inlined_as_list: true
      supplied_facets:
        description: Core facets and bindings declared as supplied by an assembly.
        range: SuppliedCoreFacet
        multivalued: true
        inlined_as_list: true
      field_resolutions:
        description: Explicit authority choices for overlapping core assertions.
        range: FieldResolution
        multivalued: true
        inlined_as_list: true
      resolved_facet_index:
        description: Materialized authoritative lookup for supplied facets.
        range: ResolvedFacetIndexEntry
        required: true
        multivalued: true
        inlined_as_list: true
      semantic_identity:
        description: Digest-pinned semantic identity of a contribution or assembly.
        range: AssemblySemanticIdentity
        required: true
        inlined: true
      status:
        description: Declared completeness state of an assembly.
        range: CorePopulationAssemblyStatus
        required: true
      prior_assembly:
        range: string
        description: Identifier of an earlier assembly revision for the same snapshot.
      replacement_reason:
        description: Reason this assembly supersedes or corrects the prior assembly.
