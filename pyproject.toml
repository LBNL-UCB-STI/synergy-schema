[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synergy-schema"
version = "0.0.0"
description = "Federated LinkML semantic contracts for Synergy workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "linkml-runtime>=1.12.1,<2",
    "linkml>=1.12.1,<2",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
consist = ["consist[git]>=0.3.5; python_version >= '3.11'"]

[project.scripts]
synergy-conformance = "synergy_schema.conformance.cli:main"

[dependency-groups]
dev = [
  "pandas>=2,<3",
  "pytest>=8,<9",
  "tabulate>=0.9,<1",
  "zensical==0.0.40; python_version < '3.11'",
  "zensical==0.0.70; python_version >= '3.11'",
]

[tool.hatch.build]
include = [
  "src/synergy_schema/**/*.py",
  "src/synergy_schema/schema/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synergy_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
override-dependencies = ["sqlalchemy>=2.0.44"]
