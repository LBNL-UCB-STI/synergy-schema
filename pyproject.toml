[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synergy-schema"
version = "0.0.0"
description = "Federated LinkML semantic contracts for Synergy workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["linkml-runtime>=1.9.4,<2", "linkml>=1.9.4,<2"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "zensical==0.0.40",
]

[tool.hatch.build]
include = [
  "src/synergy_schema/**/*.py",
  "src/synergy_schema/schema/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synergy_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
