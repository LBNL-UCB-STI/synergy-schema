urbansim_activitysim_population:
  id: urbansim_activitysim_population
  source_representation: UrbanSim population identity projections
  target_representation: ActivitySim population identity projections
  slot_mappings:
    - id: urbansim_activitysim_household_identity
      source_paths:
        - UrbanSimHouseholdPopulationRecord.household_id
      target_paths:
        - ActivitySimHouseholdInputRecord.household_id
      mapping_status: direct
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: Preserve the UrbanSim household identifier in the ActivitySim household input.
      evidence:
        - pilates/activitysim/preprocessor.py:3524
    - id: urbansim_activitysim_person_identity
      source_paths:
        - UrbanSimPersonPopulationRecord.person_id
      target_paths:
        - ActivitySimPersonInputRecord.person_id
      mapping_status: direct
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: Preserve the UrbanSim person identifier in the ActivitySim person input.
      evidence:
        - pilates/activitysim/preprocessor.py:3259
    - id: urbansim_activitysim_person_household_membership
      source_paths:
        - UrbanSimPersonPopulationRecord.household_id
        - UrbanSimHouseholdPopulationRecord.household_id
      target_paths:
        - ActivitySimPersonInputRecord.household_id
        - ActivitySimHouseholdInputRecord.household_id
      mapping_status: direct
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: many-to-one
      transformation: Preserve the person-to-household foreign key through ActivitySim preprocessing.
      evidence:
        - pilates/activitysim/preprocessor.py:3269
        - pilates/activitysim/preprocessor.py:3269
    - id: urbansim_activitysim_member_ordinal
      source_paths:
        - UrbanSimPersonPopulationRecord.member_id
      target_paths:
        - ActivitySimPersonInputRecord.member_id
      mapping_status: derived
      identity_role: within_parent_ordinal
      value_stability: regenerated
      relationship_cardinality: one-to-one
      transformation: Recalculate one-based household member ordinals after filtering ActivitySim persons.
      evidence:
        - pilates/activitysim/preprocessor.py:3349
    - id: urbansim_activitysim_household_block_to_taz
      source_paths:
        - UrbanSimHouseholdPopulationRecord.block_id
      target_paths:
        - ActivitySimHouseholdInputRecord.taz
      mapping_status: derived
      identity_role: geographic_identifier
      value_stability: derived
      relationship_cardinality: many-to-one
      transformation: Look up each household block identifier in the configured ActivitySim zone column.
      evidence:
        - pilates/activitysim/preprocessor.py:3523
    - id: urbansim_activitysim_person_block_to_taz
      source_paths:
        - UrbanSimHouseholdPopulationRecord.block_id
      target_paths:
        - ActivitySimPersonInputRecord.taz
      mapping_status: derived
      identity_role: geographic_identifier
      value_stability: derived
      relationship_cardinality: many-to-one
      transformation: >-
        Derive each person's ActivitySim TAZ by mapping its household through
        the household block-to-zone lookup.
      evidence:
        - pilates/activitysim/preprocessor.py:3268-3271
    - id: activitysim_work_location_aliases
      source_paths:
        - ActivitySimPersonInputRecord.work_zone_id
      target_paths:
        - ActivitySimPersonInputRecord.workplace_taz
      mapping_status: renamed
      identity_role: geographic_identifier
      value_stability: alias
      relationship_cardinality: one-to-one
      transformation: Keep the two transitional workplace-zone aliases synchronized from the canonical source.
      evidence:
        - pilates/activitysim/preprocessor.py:3255
    - id: activitysim_school_location_alias
      source_paths:
        - ActivitySimPersonInputRecord.school_zone_id
      target_paths:
        - ActivitySimPersonInputRecord.school_taz
      mapping_status: renamed
      identity_role: geographic_identifier
      value_stability: alias
      relationship_cardinality: one-to-one
      transformation: Copy the canonical school zone value into the transitional PILATES alias.
      evidence:
        - pilates/activitysim/preprocessor.py:3257

activitysim_atlas_population:
  id: activitysim_atlas_population
  source_representation: ActivitySim population identity projections
  target_representation: ATLAS population records via the updated UrbanSim population datastore
  slot_mappings:
    - id: activitysim_atlas_household_identity
      source_paths:
        - ActivitySimHouseholdInputRecord.household_id
      target_paths:
        - AtlasHouseholdInput.household_id
      mapping_status: direct
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: >-
        Preserve the household identifier through ActivitySim postprocessing's
        updated UrbanSim household table, then export it as the explicit ATLAS
        household CSV index.
      evidence:
        - >-
          pilates/activitysim/postprocessor.py:470-488;
          pilates/activitysim/postprocessor.py:715-723;
          pilates/atlas/preprocessor.py:836-844
    - id: activitysim_atlas_person_identity
      source_paths:
        - ActivitySimPersonInputRecord.person_id
      target_paths:
        - AtlasPersonInput.person_id
      mapping_status: direct
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: >-
        Preserve the person identifier through ActivitySim postprocessing's
        updated UrbanSim person table, then export it as the explicit ATLAS
        person CSV index.
      evidence:
        - >-
          pilates/activitysim/postprocessor.py:424-468;
          pilates/activitysim/postprocessor.py:715-723;
          pilates/atlas/preprocessor.py:855-861
    - id: activitysim_atlas_person_household_membership
      source_paths:
        - ActivitySimPersonInputRecord.household_id
      target_paths:
        - AtlasPersonInput.household_id
      mapping_status: direct
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: many-to-one
      transformation: >-
        Preserve the person-to-household foreign key through ActivitySim
        postprocessing's updated UrbanSim person table, then export it in the
        ATLAS persons CSV.
      evidence:
        - >-
          pilates/activitysim/postprocessor.py:424-468;
          pilates/activitysim/postprocessor.py:715-723;
          pilates/atlas/preprocessor.py:855-861

atlas_core_population_state:
  id: atlas_core_population_state
  source_representation: Post-ATLAS household and person records plus PopulationSnapshot context
  target_representation: Canonical snapshot-scoped household, person, and membership states
  slot_mappings:
    - id: atlas_core_household_longitudinal_identity
      source_paths:
        - AtlasHouseholdInput.household_id
      target_paths:
        - HouseholdState.longitudinal_household_ref
      mapping_status: derived
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: >-
        Qualify the producer-preserved household identifier in the declared
        population namespace; do not treat it as the snapshot occurrence ID.
      evidence:
        - >-
          src/synergy_schema/schema/models/atlas/atlas_population.yaml:35-39;
          examples/post_atlas_population_bundle/core_population_states.yaml:1-4
    - id: atlas_core_household_snapshot_scope
      source_paths:
        - PopulationSnapshot.id
      target_paths:
        - HouseholdState.population_snapshot_ref
      mapping_status: direct
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: one-to-many
      transformation: Bind each household occurrence to the enclosing population snapshot.
      evidence:
        - src/synergy_schema/schema/core/population_snapshot.yaml:26-29;66-78
    - id: atlas_core_person_longitudinal_identity
      source_paths:
        - AtlasPersonInput.person_id
      target_paths:
        - PersonState.longitudinal_person_ref
      mapping_status: derived
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: >-
        Qualify the producer-preserved person identifier in the declared
        population namespace; do not treat it as the snapshot occurrence ID.
      evidence:
        - >-
          src/synergy_schema/schema/models/atlas/atlas_population.yaml:127-131;
          examples/post_atlas_population_bundle/core_population_states.yaml:5-8
    - id: atlas_core_person_snapshot_scope
      source_paths:
        - PopulationSnapshot.id
      target_paths:
        - PersonState.population_snapshot_ref
      mapping_status: direct
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: one-to-many
      transformation: Bind each person occurrence to the enclosing population snapshot.
      evidence:
        - src/synergy_schema/schema/core/population_snapshot.yaml:26-29;95-107
    - id: atlas_core_membership_person_state
      source_paths:
        - AtlasPersonInput.person_id
      target_paths:
        - HouseholdMembership.person_state_ref
      mapping_status: derived
      identity_role: relationship_foreign_key
      value_stability: artifact_scoped
      relationship_cardinality: one-to-one
      transformation: >-
        Resolve person_id to the PersonState occurrence constructed in the same
        PopulationSnapshot rather than copying the producer identifier.
      evidence:
        - >-
          src/synergy_schema/schema/models/atlas/atlas_population.yaml:127-131;
          src/synergy_schema/schema/core/population_snapshot.yaml:137-146
    - id: atlas_core_membership_household_state
      source_paths:
        - AtlasPersonInput.household_id
      target_paths:
        - HouseholdMembership.household_state_ref
      mapping_status: derived
      identity_role: relationship_foreign_key
      value_stability: artifact_scoped
      relationship_cardinality: many-to-one
      transformation: >-
        Resolve household_id to the HouseholdState occurrence constructed in
        the same PopulationSnapshot rather than copying the producer identifier.
      evidence:
        - >-
          src/synergy_schema/schema/models/atlas/atlas_population.yaml:203-210;
          src/synergy_schema/schema/core/population_snapshot.yaml:147-156
    - id: atlas_core_membership_snapshot_scope
      source_paths:
        - PopulationSnapshot.id
      target_paths:
        - HouseholdMembership.population_snapshot_ref
      mapping_status: direct
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: one-to-many
      transformation: Bind each household membership to the enclosing population snapshot.
      evidence:
        - src/synergy_schema/schema/core/population_snapshot.yaml:26-29;124-136
  identity_constructions:
    - id: construct_household_state_identity
      source_paths:
        - PopulationSnapshot.id
        - HouseholdState.longitudinal_household_ref
      target_path: HouseholdState.household_state_id
      mapping_status: derived
      identity_role: artifact_scoped_identifier
      value_stability: artifact_scoped
      relationship_cardinality: one-to-one
      transformation: >-
        Construct the household occurrence identifier from the enclosing
        snapshot identity and the qualified producer household identity.
      evidence:
        - examples/post_atlas_population_bundle/core_population_states.yaml:1-4
    - id: construct_person_state_identity
      source_paths:
        - PopulationSnapshot.id
        - PersonState.longitudinal_person_ref
      target_path: PersonState.person_state_id
      mapping_status: derived
      identity_role: artifact_scoped_identifier
      value_stability: artifact_scoped
      relationship_cardinality: one-to-one
      transformation: >-
        Construct the person occurrence identifier from the enclosing snapshot
        identity and the qualified producer person identity.
      evidence:
        - examples/post_atlas_population_bundle/core_population_states.yaml:5-8
    - id: construct_household_membership_identity
      source_paths:
        - PopulationSnapshot.id
        - HouseholdMembership.person_state_ref
        - HouseholdMembership.household_state_ref
      target_path: HouseholdMembership.household_membership_id
      mapping_status: derived
      identity_role: artifact_scoped_identifier
      value_stability: artifact_scoped
      relationship_cardinality: one-to-one
      transformation: >-
        Construct the membership occurrence identifier from the enclosing
        snapshot and its resolved person and household state references.
      evidence:
        - examples/post_atlas_population_bundle/core_population_states.yaml:9-13

atlas_polaris_population:
  id: atlas_polaris_population
  source_representation: ATLAS population records
  target_representation: >-
    POLARIS population identity projections and their enclosing PopulationSnapshot
    artifact scope
  slot_mappings:
    - id: atlas_polaris_household_identity
      source_paths:
        - AtlasHouseholdInput.household_id
      target_paths:
        - PolarisHouseholdRecord.household
      mapping_status: renamed
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: Cast household_id to bigint and rename it to the POLARIS household identifier.
      evidence:
        - pilates/generated/polaris_population_translation/10_households.sql:7
    - id: atlas_polaris_household_hhold_identity
      source_paths:
        - AtlasHouseholdInput.household_id
      target_paths:
        - PolarisHouseholdRecord.hhold
      mapping_status: renamed
      identity_role: entity_identifier
      value_stability: alias
      relationship_cardinality: one-to-one
      transformation: Cast household_id to bigint and expose it through the required POLARIS hhold alias.
      evidence:
        - pilates/generated/polaris_population_translation/10_households.sql:8
    - id: atlas_polaris_person_identity
      source_paths:
        - AtlasPersonInput.person_id
      target_paths:
        - PolarisPersonRecord.person
      mapping_status: renamed
      identity_role: entity_identifier
      value_stability: preserved
      relationship_cardinality: one-to-one
      transformation: Cast person_id to bigint and rename it to the POLARIS person identifier.
      evidence:
        - pilates/generated/polaris_population_translation/20_persons.sql:10
    - id: atlas_polaris_person_household_membership
      source_paths:
        - AtlasPersonInput.household_id
      target_paths:
        - PolarisPersonRecord.household
      mapping_status: renamed
      identity_role: relationship_foreign_key
      value_stability: preserved
      relationship_cardinality: many-to-one
      transformation: Cast household_id to bigint and rename it to the POLARIS person household reference.
      evidence:
        - pilates/generated/polaris_population_translation/20_persons.sql:79
    - id: atlas_polaris_member_ordinal
      source_paths:
        - AtlasPersonInput.member_id
      target_paths:
        - PolarisPersonRecord.id
      mapping_status: derived
      identity_role: within_parent_ordinal
      value_stability: derived
      relationship_cardinality: one-to-one
      transformation: Subtract the detected source member_id offset to normalize the POLARIS ordinal to zero-based.
      evidence:
        - pilates/generated/polaris_population_translation/20_persons.sql:11
    - id: atlas_polaris_vehicle_scoped_identity
      source_paths:
        - AtlasVehicleOutput.household_id
        - AtlasVehicleOutput.vehicle_id
        - AtlasVehicleOutput.year
      target_paths:
        - PolarisVehicleRecord.hhold
        - PolarisVehicleRecord.vehicle_id
        - PopulationSnapshot.simulation_year
      mapping_status: derived
      identity_role: artifact_scoped_identifier
      value_stability: artifact_scoped
      relationship_cardinality: one-to-one
      transformation: >-
        Cast and retain household_id and vehicle_id as the POLARIS row key. The
        POLARIS row drops the ATLAS forecast/output year, so the scoped identity
        relies on the enclosing snapshot artifact whose simulation_year agrees
        with the ATLAS vehicle year.
      evidence:
        - pilates/generated/polaris_population_translation/40_vehicles.sql:6
        - pilates/generated/polaris_population_translation/40_vehicles.sql:5
        - pilates/generated/polaris_population_translation/40_vehicles.sql:3-6
