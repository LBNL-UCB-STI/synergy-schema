[project]
site_name = "Synergy Schema"
site_description = "Shared semantic contracts for integrated modeling workflows"
docs_dir = "docs"
site_dir = "site"
nav = [
    { "Overview" = "index.md" },
    { "Generated schema reference" = "schema/index.md" },
]

[project.theme]
language = "en"
features = [
    "content.code.copy",
    "navigation.indexes",
    "navigation.top",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch color mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
