        kind: sql_column
        path: polaris_households.location
  - id: assumption-A5
    residue_kind: lookup_or_crosswalk
    deterministic_rule: Copy attributes across years when no change event occurs.
    rationale: 'A5: Continuity principle: surviving households, persons, and vehicles
