field_mappings:
  - id: map-household-id
    description: DEMOS household identifier mapped to POLARIS household primary key.
    transformation_mode: renamed
    rule: Carry the DEMOS household ID directly into polaris_households.household.
    implementation_evidence: &id003
      - implementation/translation.sql
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_households.household
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_households.household
  - id: map-household-income
    description: DEMOS household annual income deflated via CPI series to POLARIS
      dollar year (A7).
    transformation_mode: derived
    rule: Deflate DEMOS household income using the official CPI deflation factor to
      the POLARIS base dollar year.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_households.income
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_households.income
  - id: map-person-id
    description: DEMOS person identifier mapped to POLARIS person primary key.
    transformation_mode: direct
    rule: Map DEMOS person ID directly to polaris_persons.person.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.person
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.person
  - id: map-person-household-id
    description: DEMOS person foreign key to owning household.
    transformation_mode: direct
    rule: Map DEMOS household ID foreign key directly to polaris_persons.household.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.household
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.household
  - id: map-person-gender
    description: DEMOS person gender (1 Male, 2 Female) mapped directly (X-P1).
    transformation_mode: direct
    rule: Map DEMOS gender (1 Male, 2 Female) directly to POLARIS gender enum domain.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.gender
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.gender
  - id: map-person-age
    description: DEMOS person age in years mapped directly (X-P1).
    transformation_mode: direct
    rule: Map DEMOS integer age in years directly to polaris_persons.age.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.age
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.age
  - id: map-person-education
    description: DEMOS educational attainment with K-12 consistency override (X-P1,
      X-P6, A24).
    transformation_mode: derived
    rule: Map DEMOS education (ACS SCHL 0-24), applying K-12 consistency override
      to grade code g when outside allowed range.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.education
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.education
  - id: map-person-income
    description: DEMOS person annual income deflated via CPI series to POLARIS dollar
      year (A7).
    transformation_mode: derived
    rule: Deflate DEMOS person income using the CPI deflation factor to the POLARIS
      base dollar year.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.income
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.income
  - id: map-person-employment
    description: DEMOS person employment status (ACS ESR) mapped directly (X-P1, X-P2).
    transformation_mode: direct
    rule: Map DEMOS employment status (ACS ESR 0-6) directly to POLARIS employment
      domain.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.employment
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.employment
  - id: map-person-marital-status
    description: DEMOS person marital status (1-5 identical; 0 carries previous value,
      draws D-P3a, or derives deterministically from relationship/age in core projection) (X-P1, A27).
    transformation_mode: derived
    rule: 'Map DEMOS marital status (1-5 identical; code 0 carries previous value for
      surviving, draws D-P3a for new, or derives deterministically from relationship
      and age in core projection: relate=1 -> 1, age < 15 -> 5, relate=0 -> 1, else 5).'
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.marital_status
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.marital_status
  - id: map-person-school-enrollment
    description: DEMOS school enrollment (0 NA, 1 none, 2 public, 3 private) with
      public/private continuity (X-P1, A25).
    transformation_mode: derived
    rule: Map DEMOS school enrollment, preserving prior public/private status for
      continuing students.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: demos_persons.school_enrollment
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_persons.school_enrollment
  - id: map-vehicle-household-id
    description: ATLAS vehicle owning household mapped to POLARIS hhold column (A41).
    transformation_mode: renamed
    rule: Map ATLAS HOUSEID to polaris_vehicles.hhold.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: atlas_vehicles.HOUSEID
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_vehicles.hhold
  - id: map-vehicle-id
    description: ATLAS vehicle sequence ID mapped to POLARIS vehicle_id (carried for
      retained, sequenced for new, A42).
    transformation_mode: derived
    rule: Map ATLAS VEHID to polaris_vehicles.vehicle_id, retaining ID across years
      for surviving vehicles.
    implementation_evidence: *id003
    source_element:
      catalog: *id001
      kind: sql_column
      path: atlas_vehicles.VEHID
    target_element:
      catalog: *id002
      kind: sql_column
      path: polaris_vehicles.vehicle_id
residue_records:
  - id: demos-hh-block-id-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Condition dwelling draw D-H1 on block GEOID tract.
    rationale: DEMOS census block GEOID is used for spatial conditioning in dwelling
      draw D-H1 but not stored directly as a column in POLARIS demand database.
    disposition: Retain in source pipeline for spatial conditioning; omit from polaris_households
      table.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.block_id
  - id: demos-hh-county-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Fallback to county ID when tract match fails in D-H1.
    rationale: DEMOS lcm_county_id serves as geographic fallback when tract cannot
      be matched (A12), but is not a direct column in POLARIS households.
    disposition: Retain in source pipeline for geographic fallback; omit from polaris_households
      table.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.lcm_county_id
  - id: demos-hh-race-of-head-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Assign race_of_head to new household reference person.
    rationale: DEMOS race_of_head is used to assign head race for new households (A26)
      rather than stored on the household table.
    disposition: Pass to person synthesis step for new household head race; omit from
      polaris_households.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.race_of_head
  - id: demos-hh-persons-context-dropped
    residue_kind: dropped_context
    deterministic_rule: Verify count matches person rows, then drop.
    rationale: DEMOS household persons count is checked against person rows; the actual
      count of person rows in polaris_persons is authoritative.
    disposition: Drop column after cross-validation; compute target column from person
      row count.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.persons
  - id: demos-hh-is-reorg-unmapped
    residue_kind: unmapped_source
    deterministic_rule: None
    rationale: DEMOS reorganization household indicator is an internal DEMOS simulation
      diagnostic not consumed by POLARIS.
    disposition: Retain in source diagnostic artifacts; omit from POLARIS demand database.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.is_reorg_household
  - id: demos-hh-age-of-head-unmapped
    residue_kind: unmapped_source
    deterministic_rule: None
    rationale: DEMOS household-level age_of_head is stale; person table age of reference
      person is authoritative.
    disposition: Drop stale household-level head age; source from reference person
      record.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.age_of_head
  - id: demos-hh-workers-unmapped
    residue_kind: unmapped_source
    deterministic_rule: None
    rationale: DEMOS household workers count is superseded by the authoritative count
      of persons with ESR 1 or 4 (X-P2, A22).
    disposition: Drop DEMOS household worker count; recompute from person employment
      records.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_households.workers
  - id: demos-person-relp-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Evaluate household composition and head relationship.
    rationale: DEMOS relationship to head (RELP) drives household type composition
      (X-H1) and race inheritance (D-P3b), but is not a persistent POLARIS demand
      column.
    disposition: Consume during household type derivation and race draw; omit from
      polaris_persons table.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_persons.relp
  - id: demos-person-id-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Regenerate zero-based index 0..n-1 per household.
    rationale: DEMOS person within-household id contains gaps/blanks; POLARIS regenerates
      zero-based consecutive id 0..n-1 per household.
    disposition: Drop non-consecutive source IDs; regenerate sequential 0..n-1 index
      in POLARIS.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: demos_persons.id
  - id: atlas-hh-houseid-dropped
    residue_kind: dropped_context
    deterministic_rule: Verify HOUSEID matches DEMOS household ID.
    rationale: ATLAS household HOUSEID is validated against DEMOS household IDs; DEMOS
      household table provides primary identity.
    disposition: Validate join identity then drop; DEMOS household table provides
      canonical household records.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_households.HOUSEID
  - id: atlas-hh-nvehicles-dropped
    residue_kind: dropped_context
    deterministic_rule: Verify count matches ATLAS vehicle records.
    rationale: ATLAS household vehicle count is checked for consistency against vehicle
      rows; count of rows is authoritative.
    disposition: Validate against vehicle row count then drop from household record.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_households.nvehicles
  - id: atlas-hh-county-fips-dropped
    residue_kind: dropped_context
    deterministic_rule: Verify against DEMOS block_id county.
    rationale: ATLAS household county FIPS is redundant with DEMOS geography and dropped
      in favor of DEMOS block_id.
    disposition: Drop redundant ATLAS geographic column.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_households.county_fips
  - id: atlas-hh-tractid-dropped
    residue_kind: dropped_context
    deterministic_rule: Verify against DEMOS block_id tract.
    rationale: ATLAS household tractid is redundant with DEMOS block_id geography.
    disposition: Drop redundant ATLAS tract identifier.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_households.tractid
  - id: atlas-veh-bodytype-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Crosswalk X-V1 and draw D-V1 into vehicle_class.
    rationale: ATLAS vehicle bodytype is crosswalked (X-V1) and size-drawn (D-V1)
      to determine POLARIS vehicle_class key rather than mapped directly.
    disposition: Transform through X-V1/D-V1 into vehicle_class dimension of polaris_vehicle_type
      lookup.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_vehicles.bodytype
  - id: atlas-veh-pred-power-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Crosswalk X-V2 and X-V3 to powertrain and fuel types.
    rationale: ATLAS predicted powertrain is crosswalked via X-V2 to powertrain_type
      and X-V3 to fuel_type keys rather than stored directly.
    disposition: Transform through X-V2/X-V3 into powertrain_type and fuel_type dimensions
      of polaris_vehicle_type lookup.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_vehicles.pred_power
  - id: atlas-veh-modelyear-unmapped
    residue_kind: unmapped_source
    deterministic_rule: Compute age = year - modelyear, bucket into vintage_type X-V4.
    rationale: ATLAS modelyear is converted to age (simulation_year - modelyear) and
      bucketed into vintage_type via X-V4 rather than stored as year.
    disposition: Transform through age calculation and X-V4 bucketing into vintage_type
      dimension.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_vehicles.modelyear
  - id: atlas-veh-vintage-category-dropped
    residue_kind: dropped_context
    deterministic_rule: None
    rationale: ATLAS proprietary vintage category is dropped in favor of explicit
      modelyear age bucketing (X-V4).
    disposition: Drop ATLAS internal vintage categories in favor of POLARIS vintage_type
      buckets.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_vehicles.vintage_category
  - id: atlas-veh-annual-mileage-dropped
    residue_kind: dropped_context
    deterministic_rule: None
    rationale: ATLAS annual mileage estimate is not represented in the POLARIS demand
      database vehicles table.
    disposition: Omit ATLAS annual mileage estimate from translated POLARIS demand
      database.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id001
        kind: sql_column
        path: atlas_vehicles.annual_mileage
  - id: target-default-polaris-households-Has-Residential-Charging
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, or draw D-H1.
    default_value: 0
    rationale: Carried from t-1 for surviving households; drawn jointly in D-H1 for
      new households (A10, A11).
    disposition: Populate polaris_households.Has_Residential_Charging via deterministic
      calculation or model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.Has_Residential_Charging
  - id: target-default-polaris-households-bikes
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, 0 for new.
    default_value: 0
    rationale: 'POLARIS demand model output: carried from t-1 for surviving households;
      initialized to 0 for new households (A16).'
    disposition: Populate polaris_households.bikes via deterministic calculation or
      model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.bikes
  - id: target-default-polaris-households-delRat
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, 0 for new.
    default_value: 0.0
    rationale: 'POLARIS demand model output: carried from t-1 for surviving households;
