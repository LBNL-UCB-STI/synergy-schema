    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.delRat
  - id: target-default-polaris-households-dispose-veh
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, 0 for new.
    default_value: 0
    rationale: 'POLARIS demand model output: carried from t-1 for surviving households;
      initialized to 0 for new households (A16).'
    disposition: Populate polaris_households.dispose_veh via deterministic calculation
