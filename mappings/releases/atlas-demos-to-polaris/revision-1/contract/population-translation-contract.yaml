  - id: target-default-polaris-households-type
    residue_kind: required_target_default
    deterministic_rule: Evaluate X-H1 composition and tenure crosswalk X-H2.
    rationale: 'Household type enum (1-11): tenure x HHT recomputed annually from
      composition (X-H1, X-H2, A13, A14).'
    disposition: Populate polaris_households.type via deterministic calculation or
      model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.type
  - id: target-default-polaris-households-vehicles
