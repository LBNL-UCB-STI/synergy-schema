    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.ecom
  - id: target-default-polaris-households-hhold
    residue_kind: required_target_default
    deterministic_rule: Previous value for surviving, -1 for new.
    default_value: -1
    rationale: 'Physical alias: previous value for surviving households, -1 for new
      households pending POLARIS internal ID assignment.'
    disposition: Populate polaris_households.hhold via deterministic calculation or
      model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.hhold
  - id: target-default-polaris-households-housing-unit-type
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, or draw D-H1.
    default_value: 1
    rationale: 'Housing unit type enum (1-5): carried for surviving; drawn via D-H1
      for new (X-H3, A10).'
    disposition: Populate polaris_households.housing_unit_type via deterministic calculation
      or model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.housing_unit_type
  - id: target-default-polaris-households-workers
    residue_kind: required_target_default
    deterministic_rule: COUNT(person) WHERE employment IN (1, 4).
    rationale: 'Derived count of household workers: sum of household persons with
      employment ESR 1 or 4 (A22).'
    disposition: Populate polaris_households.workers via deterministic calculation
      or model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.workers
  - id: target-default-polaris-households-location
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, or draw D-H1.
    default_value: 0
    rationale: 'Zone location ID: carried from t-1 for surviving; drawn in D-H1 within
      tract/county for new (A10, A11, A12).'
    disposition: Populate polaris_households.location via deterministic calculation
      or model default.
    implementation_evidence: *id003
    affected_elements:
      - catalog: *id002
        kind: sql_column
        path: polaris_households.location
  - id: target-default-polaris-households-num-groceries
    residue_kind: required_target_default
    deterministic_rule: Carry t-1 value for surviving, 0 for new.
