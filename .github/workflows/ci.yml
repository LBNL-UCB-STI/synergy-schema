name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run linkml-lint src/synergy_schema/schema/synergy_schema.yaml
      - run: uv run python scripts/export_deliverable1.py
      - run: uv run pytest -q
      - run: UV_CACHE_DIR=/tmp/synergy-schema-uv-cache scripts/preview-schema-docs build
